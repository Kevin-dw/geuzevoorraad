/* ============================================================
   MELDINGEN — een melding in beeld met een geluidje, en als je het
   toestaat ook een melding buiten de app.
   ============================================================ */
let bekendeMeldingen=null;        // wat we de vorige keer al gezien hadden
let geluidBron=null;

/** Kort tweetonig geluidje, zelf opgewekt zodat er geen bestand nodig is. */
function speelGeluid(){
  if(bestand.instellingen.geluid===false) return;
  try{
    if(!geluidBron) geluidBron=new (window.AudioContext||window.webkitAudioContext)();
    if(geluidBron.state==="suspended") geluidBron.resume();
    const nu=geluidBron.currentTime;
    [[880,0],[1180,0.13]].forEach(([hz,start])=>{
      const osc=geluidBron.createOscillator(), vol=geluidBron.createGain();
      osc.type="sine"; osc.frequency.value=hz;
      vol.gain.setValueAtTime(0,nu+start);
      vol.gain.linearRampToValueAtTime(0.22,nu+start+0.02);
      vol.gain.exponentialRampToValueAtTime(0.001,nu+start+0.16);
      osc.connect(vol); vol.connect(geluidBron.destination);
      osc.start(nu+start); osc.stop(nu+start+0.18);
    });
  }catch(e){}
}
/** Browsers laten geluid pas toe na een handeling; inloggen is die handeling. */
function ontgrendelGeluid(){
  try{
    if(!geluidBron) geluidBron=new (window.AudioContext||window.webkitAudioContext)();
    if(geluidBron.state==="suspended") geluidBron.resume();
  }catch(e){}
}

function zetGeluid(aan){
  bestand.instellingen.geluid=aan;
  opslaan();
  if(aan){ ontgrendelGeluid(); speelGeluid(); }
  teken();
}

/** Kijkt of er iets nieuws bij is gekomen en meldt alleen dat. */
function controleerMeldingen(){
  if(!gebruiker) return;
  const s=standAlles();

  const nieuwe=[];
  for(const afd in s) s[afd].nieuw.forEach(m=>{
    const sleutel=afd+"|"+m.id+"|"+m.aantal;
    nu[sleutel]=m;
    if(bekendeMeldingen&&!bekendeMeldingen[sleutel]) nieuwe.push(m);

  bekendeMeldingen=nu;
  if(eersteKeer||!nieuwe.length) return;
  nieuwe.slice(0,3).forEach(toonMelding);
  speelGeluid();
}

/* ============================================================
   SYNCHRONISEREN — alle apparaten delen één bestand op een webadres.
   Boekingen worden samengevoegd op hun unieke id, zodat twee mensen
   tegelijk kunnen boeken zonder elkaars werk te overschrijven.
   ============================================================ */
let syncTimer=null, syncBezig=false, syncGepland=false, vanSync=false;
let syncStand={aan:false, ok:null, laatst:0, fout:""};

function syncActief(){ return !!(bestand.instellingen.syncUrl||"").trim(); }

function syncKoppen(){
  const k={"Content-Type":"application/json"};
  const sleutel=(bestand.instellingen.syncSleutel||"").trim();
  if(sleutel){ k["X-Master-Key"]=sleutel; k["X-Access-Key"]=sleutel; }
  return k;
}

/** Voegt een binnengekomen bestand samen met wat hier staat. */
function voegSamen(extern){
  let veranderd=false;
  if(!extern) return false;

  // Beheerinstellingen gelden voor iedereen; de laatste wijziging wint.
  if(extern.beheer){
    const hier=beheerDeel();
    if((extern.beheer.gewijzigd||0)>(hier.gewijzigd||0)){
      bestand.beheer=JSON.parse(JSON.stringify(extern.beheer));
      if(!scanAan()){ staat.uitScan=false; staat.scanBarcode=false; staat.scanDoel=""; }
      veranderd=true;
    }
  }
  // Welke uitvoering elk apparaat draait.
  if(extern.versies){
    bestand.versies=Object.assign({},extern.versies,bestand.versies||{});
    bestand.versies[apparaatId]=VERSIE;
  }
  for(const sleutel in bestand.afdelingen){
    const hier=bestand.afdelingen[sleutel];
    const daar=(extern.afdelingen&&extern.afdelingen[sleutel])||null;
    if(!daar) continue;

    // 1. Coatings samenvoegen op code; de laatst gewijzigde wint.
    const opCode={};
    hier.artikelen.forEach(a=>{ opCode[a.code]=a; });
    (daar.artikelen||[]).forEach(a=>{
      const bestaand=opCode[a.code];
      if(!bestaand){ hier.artikelen.push(a); opCode[a.code]=a; veranderd=true; }
      else if((a.gewijzigd||0)>(bestaand.gewijzigd||0)){
        Object.assign(bestaand,a); veranderd=true;
      }
    });

    // 2. Boekingen samenvoegen op hun unieke id.
    const idsHier=new Set(hier.mutaties.map(m=>m.id));
    (daar.mutaties||[]).forEach(m=>{
      if(!idsHier.has(m.id)){ hier.mutaties.push(m); idsHier.add(m.id); veranderd=true; }
    });

    // 2b. Vragen en reacties samenvoegen; de laatst gewijzigde versie wint.
    hier.vragen=hier.vragen||[];
    const opId={};
    hier.vragen.forEach(v=>{ opId[v.id]=v; });
    (daar.vragen||[]).forEach(v=>{
      const bestaand=opId[v.id];
      if(!bestaand){ hier.vragen.push(v); opId[v.id]=v; veranderd=true; return; }
      // reacties zijn optellend: alles wat de ander heeft erbij
      const reIds=new Set((bestaand.reacties||[]).map(r=>r.id));
      (v.reacties||[]).forEach(r=>{
        if(!reIds.has(r.id)){ (bestaand.reacties=bestaand.reacties||[]).push(r); veranderd=true; }
      });
      if((bestaand.reacties||[]).length>1)
        bestaand.reacties.sort((x,y)=>Date.parse(x.datum)-Date.parse(y.datum));
      if((v.gewijzigd||0)>(bestaand.gewijzigd||0)){
        bestaand.status=v.status; bestaand.wat=v.wat; bestaand.order=v.order;
        bestaand.klant=v.klant; bestaand.toelichting=v.toelichting;
        bestaand.artikelId=v.artikelId; bestaand.gewijzigd=v.gewijzigd; veranderd=true;
      }
    });

    // 3. Voorraad opnieuw uitrekenen uit de boekingen. Zo klopt hij altijd,
    //    ongeacht in welke volgorde de apparaten hun werk doorgeven.
    const perArtikel={};
    hier.mutaties.forEach(m=>{ perArtikel[m.artikelId]=(perArtikel[m.artikelId]||0)+(m.gram||0); });
    hier.artikelen.forEach(a=>{
      const som=Math.max(0,Math.round(perArtikel[a.id]||0));
      if(a.voorraadGram!==som){ a.voorraadGram=som; veranderd=true; }
    });

    // 4. Tellers gelijktrekken, anders krijgen twee apparaten dezelfde code.
    const hoogste=hier.artikelen.reduce((m,a)=>{
      const n=parseInt(String(a.code).replace(/\D/g,""),10);
      return isNaN(n)?m:Math.max(m,n);
    },0);
    const teller=Math.max(hier.tellers.artikel||0,(daar.tellers&&daar.tellers.artikel)||0,hoogste);
    if(hier.tellers.artikel!==teller){ hier.tellers.artikel=teller; veranderd=true; }
  }
  if(veranderd&&opslagWerkt){
    try{ localStorage.setItem(SLEUTEL,JSON.stringify(bestand)); }catch(e){}
  }
  return veranderd;
}

async function syncRonde(){
  if(!syncActief()||syncBezig) return;
  syncBezig=true;
  const url=(bestand.instellingen.syncUrl||"").trim();
  try{
    const resp=await fetch(url+(url.indexOf("?")<0?"?":"&")+"t="+Date.now(),
      {headers:syncKoppen(),cache:"no-store"});
    if(resp.ok){
      let extern=await resp.json();
      // JSONBin verpakt de inhoud in { record: ... }
      if(extern&&extern.record) extern=extern.record;
      if(extern&&extern.afdelingen){
        const veranderd=voegSamen(extern);
        meldEigenVersie();
        if(opruimVragen()&&opslagWerkt){
          try{ localStorage.setItem(SLEUTEL,JSON.stringify(bestand)); }catch(e){}
        }
        if(veranderd&&gebruiker){
          vanSync=true;
          try{ teken(); } finally { vanSync=false; }
        }
        if(gebruiker) controleerMeldingen();
      }
    }
    // Terugsturen zodat de anderen ons werk ook zien.
    const zetUrl=url.replace(/\/latest$/,"");
    const put=await fetch(zetUrl,{method:"PUT",headers:syncKoppen(),body:JSON.stringify(bestand)});
    syncStand.ok=put.ok; syncStand.fout=put.ok?"":("HTTP "+put.status);
    if(put.ok) syncStand.laatst=Date.now();
  }catch(e){
    syncStand.ok=false; syncStand.fout=String(e&&e.message||e);
  }
  syncBezig=false;
  werkSyncLampjeBij();
}

/* ============================================================
   FIREBASE — de database geeft zelf door wanneer er iets verandert.
   Er hoeft dus niet elke paar seconden gevraagd te worden; dat scheelt
   verkeer en het gaat sneller.
   ============================================================ */
let stroom=null, stroomHerstel=null, aanmelden=null;
const firebaseAan=()=>(bestand.instellingen.syncSoort||"firebase")==="firebase";
function firebasePad(){
  let u=(bestand.instellingen.syncUrl||"").trim().replace(/\/+$/,"");
  if(!u) return "";
  if(!/^https?:\/\//.test(u)) u="https://"+u;
  return u.replace(/\.json$/,"")+"/geuzevoorraad.json";
}
function startStroom(){
  stopStroom();
  const pad=firebasePad();
  if(!pad) return;
  syncStand.ok=null;
  try{
    stroom=new EventSource(pad);
    stroom.addEventListener("put",e=>verwerkStroom(e));
    stroom.addEventListener("patch",e=>verwerkStroom(e));
    stroom.onopen=()=>{
      syncStand.ok=true; syncStand.laatst=Date.now(); werkSyncLampjeBij();
      // Eén keer melden dat dit apparaat er is, met welke uitvoering het draait.
      // Anders weten de anderen niet dat hier nog een oude versie openstaat.
      clearTimeout(aanmelden);
      aanmelden=setTimeout(()=>{ meldEigenVersie(); schrijfFirebase(); },1500);
    };
    stroom.onerror=()=>{
      syncStand.ok=false; syncStand.fout="stream"; werkSyncLampjeBij();
      // De browser probeert zelf opnieuw; na een minuut zetten we hem vers op.
      clearTimeout(stroomHerstel);
      stroomHerstel=setTimeout(startStroom,60000);
    };
  }catch(e){ syncStand.ok=false; syncStand.fout=String(e&&e.message||e); }
}
function stopStroom(){
  clearTimeout(stroomHerstel); clearTimeout(aanmelden);
  if(stroom){ try{ stroom.close(); }catch(e){} stroom=null; }
}
function verwerkStroom(e){
  syncStand.ok=true; syncStand.laatst=Date.now();
  let pak=null;
  try{ pak=JSON.parse(e.data); }catch(err){ return; }
  if(!pak||pak.data===undefined) return werkSyncLampjeBij();
  // Bij een deelbericht halen we het geheel op; dat is eenvoudiger en veilig.
  if(pak.path&&pak.path!=="/") return haalAlles();
  gebruikExtern(pak.data);
}
async function haalAlles(){
  try{
    const r=await fetch(firebasePad(),{cache:"no-store"});
    if(r.ok) gebruikExtern(await r.json());
  }catch(e){}
}
function gebruikExtern(extern){
  if(!extern||!extern.afdelingen) return werkSyncLampjeBij();
  const veranderd=voegSamen(extern);
  if(opruimVragen()&&opslagWerkt){
    try{ localStorage.setItem(SLEUTEL,JSON.stringify(bestand)); }catch(e){}
  }
  if(veranderd&&gebruiker){
    vanSync=true;
    try{ teken(); } finally { vanSync=false; }
  }
  if(gebruiker) controleerMeldingen();
  werkSyncLampjeBij();
}
/** Eigen wijziging wegschrijven: eerst ophalen en samenvoegen, dan pas zetten. */
async function schrijfFirebase(){
  const pad=firebasePad();
  if(!pad||syncBezig) return;
  syncBezig=true;
  try{
    const r=await fetch(pad,{cache:"no-store"});
    if(r.ok){
      const extern=await r.json();
      if(extern&&extern.versies){
        bestand.versies=Object.assign({},extern.versies,bestand.versies||{});
      }
      if(extern&&extern.beheer&&(extern.beheer.gewijzigd||0)>(beheerDeel().gewijzigd||0)){
        bestand.beheer=JSON.parse(JSON.stringify(extern.beheer));
      }
      if(extern&&extern.afdelingen) voegSamen(extern);
    }
    meldEigenVersie();
    const put=await fetch(pad,{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(bestand)});
    syncStand.ok=put.ok; syncStand.fout=put.ok?"":("HTTP "+put.status);
    if(put.ok) syncStand.laatst=Date.now();
  }catch(e){ syncStand.ok=false; syncStand.fout=String(e&&e.message||e); }
  syncBezig=false;
  werkSyncLampjeBij();
}

function startSync(){
  stopSync();
  syncStand.aan=syncActief();
  if(!syncStand.aan) return;
  if(firebaseAan()){ startStroom(); return; }
  syncRonde();
  syncTimer=setInterval(syncRonde,5000);
}
function stopSync(){
  if(syncTimer){ clearInterval(syncTimer); syncTimer=null; }
  stopStroom();
  syncStand.aan=false;
}
/** Na een boeking niet wachten op de klok, maar vrijwel meteen doorgeven. */
function planSync(){
  if(!syncActief()||syncGepland) return;
  syncGepland=true;
  setTimeout(()=>{
    syncGepland=false;
    if(firebaseAan()) schrijfFirebase(); else syncRonde();
  },400);
}
function werkSyncLampjeBij(){
  const el=document.getElementById("syncLamp");
  if(!el) return;
  const stand=!syncActief()?"lokaal":(syncStand.ok===false?"fout":"live");
  el.className="syncknop "+stand;
  const woord=stand==="lokaal"?t("livelokaal"):stand==="fout"?t("verbindingmislukt"):t("liveverbonden");
  el.innerHTML=`<span class="bolletje"></span>${esc(woord)}`;
  el.title=stand==="fout"?t("syncfout")+": "+syncStand.fout:woord;

  // Zolang er geen verbinding is, staat het er groot bij. Stille storingen
  // zijn het ergst: dan denkt iedereen dat het werkt.
  const sw=document.getElementById("syncwaarschuwing");
  if(!sw) return;
  sw.innerHTML=stand==="live"?"":`<div class="melding ${stand==="lokaal"?"let":"fout"} syncbalk">
      <div style="min-width:0"><b>${stand==="lokaal"?t("nietverbonden"):t("verbindingmislukt")}</b><br>
        <span class="klein">${stand==="lokaal"?t("nietverbondensub"):esc(syncStand.fout||"")}</span></div>
      <button class="knop s rand" onclick="app.ga('instellingen')">${t("instellen")}</button>
    </div>`;
}

  bewaarSyncVelden();
  if(firebaseAan()) await schrijfFirebase(); else await syncRonde();

/* -------- camera --------
   Het videovenster wordt bij elke hertekening opnieuw opgebouwd. De camerastroom
   blijft daarom staan en wordt opnieuw aangekoppeld, en de herkenlus krijgt een
   volgnummer zodat er nooit twee tegelijk lopen. -------- */
let cameraStroom=null, videoEl=null, scanNummer=0, pogingTeller=0, laatsteScan={code:"",tijd:0};
const scanDoek=document.createElement("canvas");

/** Lukt het lezen niet, dan eerst zelf inzoomen en pas daarna om hulp vragen.
 *  Op een tablet houd je het scherm verder weg dan een telefoon; de camera
 *  levert dan te weinig beeldpunten per streepje. Zoom lost dat op. */
let zoekPogingen=0, autoZoomStand=0;
function zoekhulp(mislukt){
  if(!mislukt){ zoekPogingen=0; return; }
  zoekPogingen++;
  if(zoekPogingen%14===0) probeerInzoomen();
  if(zoekPogingen===30) scanMelding(t("komdichterbij"),"let");
  if(zoekPogingen>400) zoekPogingen=31;
}
async function probeerInzoomen(){
  if(!cameraStroom) return;
  const baan=cameraStroom.getVideoTracks()[0];
  if(!baan||!baan.getCapabilities) return;
  const kan=baan.getCapabilities();
  if(!kan.zoom) return;
  const nu=(baan.getSettings&&baan.getSettings().zoom)||kan.zoom.min||1;
  // In stapjes tot hooguit twee keer de beginstand; verder wordt het beeld onrustig.
  const grens=Math.min(kan.zoom.max,(kan.zoom.min||1)*2);
  if(nu>=grens) return;
  const stap=(kan.zoom.step||0.1);
  const doel=Math.min(grens,nu+Math.max(stap,(grens-(kan.zoom.min||1))/4));
  try{
    await baan.applyConstraints({advanced:[{zoom:doel}]});
    autoZoomStand=doel;
    const s=document.querySelector(".camknoppen input[type=range]");
    if(s) s.value=doel;
  }catch(e){}
}

function scanMelding(html,soort){
  const m=document.getElementById("scanmelding");
  if(m) m.innerHTML=html?`<div class="melding ${soort||"info"}">${html}</div>`:"";
}

async function startCamera(){
  const video=document.getElementById("video");
  if(!video) return;
  videoEl=video;

  if(cameraStroom&&cameraStroom.getVideoTracks().some(t=>t.readyState==="live")){
    if(video.srcObject!==cameraStroom) video.srcObject=cameraStroom;
    try{ await video.play(); }catch(e){}
    vulCameraKnoppen(); startHerkennen();
    return;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    scanMelding(`<b>${t("cameranietbeschikbaar")}</b><br>${t("cameranietbeschikbaarsub")}`,"fout");
    return;
  }
  try{
    // Hoge resolutie is nodig: een barcode van 20 tekens heeft ruim 370 streepjes
    // die stuk voor stuk te onderscheiden moeten zijn.
    cameraStroom=await navigator.mediaDevices.getUserMedia({video:{
      facingMode:{ideal:"environment"},width:{ideal:3840},height:{ideal:2160},
      advanced:[{focusMode:"continuous"}]}});
  }catch(e){
    try{ cameraStroom=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}}); }
    catch(e2){
      scanMelding(`<b>${t("geentoegangcamera")}</b><br>${
        esc(e2.name==="NotAllowedError"?t("camtoestaan")
          :e2.name==="NotFoundError"?t("geencamera"):t("fout")+" "+e2.message)}`,"fout");
      return;
    }
  }
  video.srcObject=cameraStroom;
  try{ await video.play(); }catch(e){}
  // Het scherm kan tijdens het openen opnieuw zijn opgebouwd; dan hangt de
  // stroom aan een videovenster dat er niet meer is. Opnieuw aankoppelen.
  const nu=document.getElementById("video");
  if(nu&&nu!==video){
    videoEl=nu; nu.srcObject=cameraStroom;
    try{ await nu.play(); }catch(e){}
  }
  vulCameraKnoppen(); startHerkennen();
}

/** Lamp en zoom als de camera dat kan; zoom is bij dichte barcodes vaak doorslaggevend. */
function vulCameraKnoppen(){
  const doel=document.getElementById("camknoppen");
  if(!doel||!cameraStroom) return;
  const baan=cameraStroom.getVideoTracks()[0];
  const kan=baan.getCapabilities?baan.getCapabilities():{};
  const nu=baan.getSettings?baan.getSettings():{};
  let h="";

/** Eén herkenlus tegelijk; oude lussen stoppen zichzelf via het volgnummer.
 *  De eigen Code 39-lezer doet het werk; de ingebouwde lezer van de browser
 *  wordt er alleen bijgehaald voor oude labels met een andere codesoort. */
async function startHerkennen(){
  const mijn=++scanNummer; zoekPogingen=0; autoZoomStand=0;
  let extra=null;
  if("BarcodeDetector" in window){
    try{ extra=new window.BarcodeDetector({formats:["code_128","qr_code","code_39"]}); }
    catch(e){ try{ extra=new window.BarcodeDetector(); }catch(e2){} }
  }
  scanMelding("");
  const lus=async()=>{
    if(mijn!==scanNummer||!cameraStroom||!videoEl||!videoEl.isConnected) return;
    if(videoEl.readyState>=2){
      try{
        // Elke poging start met andere scanlijnen, zodat over een paar
        // beelden het hele kader aan bod komt zonder het beeld op te houden.
        // Om de drie pogingen het hele beeld bekijken. Dat vangt een barcode
        // die net buiten het kader valt, zonder de snelheid te verliezen.
        const breed=(pogingTeller%3===2);
        // Niet "t" noemen: dat is de naam van de vertaalfunctie.
        const gelezen=leesCode39(videoEl,{doek:scanDoek,maxBreedte:3000,
          band:breed?1:0.34, lijnen:breed?61:41, dikte:3,
          hoeken:[0,9,-9,18,-18],offsets:[0],spreiding:0.9,
          tijdslimiet:breed?200:140,fase:pogingTeller++});
        if(gelezen){ zoekhulp(0); if(verwerkScan(gelezen)) return; }
        else zoekhulp(1);
      }catch(e){}
      if(extra){
        try{
          const c=await extra.detect(videoEl);
          if(c.length&&verwerkScan(c[0].rawValue)) return;
        }catch(e){}
      }
    }
    setTimeout(()=>requestAnimationFrame(lus),110);
  };
  requestAnimationFrame(lus);
}

function stopCamera(){
  scanNummer++;
  if(cameraStroom){ cameraStroom.getTracks().forEach(t=>t.stop()); cameraStroom=null; }
  videoEl=null;
}

let bevestiging={code:"",tijd:0};
/** Geeft terug of de code is aangenomen; zo niet, blijft de camera doorzoeken. */
function verwerkScan(code,direct){
  const nu=Date.now();
  // Dezelfde code binnen vier seconden negeren, anders herhaalt hij zichzelf.
  if(code===laatsteScan.code&&nu-laatsteScan.tijd<4000) return false;
  // Pas aannemen als dezelfde code twee keer achter elkaar gelezen is. Dat geeft
  // rust om te richten en voorkomt dat hij de barcode ernaast pakt.
  if(!direct&&(bevestiging.code!==code||nu-bevestiging.tijd>2500)){
    bevestiging={code,tijd:nu};
    scanMelding(t("stilhouden"),"info");
    return false;
  }
  bevestiging={code:"",tijd:0};
  laatsteScan={code,tijd:nu};
  // Scannen om een barcode aan een bestaande coating te koppelen.
  if(staat.scherm==="voorraad"&&staat.scanDoel==="artikel"){
    stopCamera();
    if(navigator.vibrate) navigator.vibrate([40,40,40]);
    const a=artikel(staat.scanArtikelId);
    if(a){
      const bezet=db.artikelen.filter(x=>x.id!==a.id&&normaliseerBarcode(x.barcode)===code);
      a.barcode=code; a.gewijzigd=Date.now(); opslaan();
      toast(t("barcodegekoppeld")+": "+code+(bezet.length?" · "+t("ookop")+" "+bezet.length:""));
    }
    staat.scanDoel="";
    teken();
    return true;
  }
  // Scannen we voor het barcodeveld bij een nieuwe coating? Dan alleen invullen.
  if(staat.scherm==="inboeken"&&staat.scanBarcode){
    stopCamera();
    if(navigator.vibrate) navigator.vibrate([40,40,40]);
    bewaarInboekForm();
    staat.nieuwForm.barcode=code;
    staat.scanBarcode=false; staat.scanDoel="";
    toast(t("barcodegescand")+": "+code);
    teken();
    return true;
  }
  // Camera meteen uit: anders leest hij dezelfde code opnieuw en gooit hij
  // het formulier weg terwijl je aan het invullen bent.
  stopCamera();
  if(navigator.vibrate) navigator.vibrate([40,40,40]);
  toast(t("gelezen")+" "+code);
  zoekCode(code);
  return true;
}

// Toont meteen de RAL-kleur en -naam zodra je een nummer typt.
function toonKleur(ruw,doelId){
  const hint=document.getElementById(doelId||"kleurHint");
  if(!hint) return;
  const kleur=normaliseerKleur(ruw), info=ralInfo(kleur);
  if(info){
    hint.style.display="block";
    hint.innerHTML=`<span class="stip s" style="display:inline-block;vertical-align:-5px;background:${info.hex}"></span>
      <b>${esc(kleur)}</b> — ${esc(ralNaam(kleur)||info.naam)}`;
  }else if(kleur){
    hint.style.display="block";
    hint.innerHTML=`<span class="stip s" style="display:inline-block;vertical-align:-5px;background:#6b6e6f"></span>
      ${esc(kleur)} staat niet in de RAL-lijst; het blokje blijft grijs.`;
  }else hint.style.display="none";
}

function verwerk(){
  if(grendel()) return;
  const el=id=>document.getElementById(id);
  const gram=kgNaarGram(el("nKg").value);
  if(gram<=0) return toast(isMagazijn()?t("kieseerst"):t("vulkilo"));
  const aantal=Math.max(1,Math.min(99,+el("nAantal").value||1));
  const totaal=gram*aantal;


  // Nieuw magazijnartikel: andere velden, hele aantallen.
  if(el("nMerk")&&isMagazijn()){
    const merk=el("nMerk").value.trim();
    const naam=el("nKleur").value.trim();
    if(!naam) return toast(t("omschrijvingverplicht"));
    const categorie=el("nSoort").value, maat=el("nType").value.trim();
    const lev=(el("nLev")?el("nLev").value:"").trim();
    const gekozenIcoon=(el("nIcoon")?el("nIcoon").value:"").trim();
    const bewaak=(el("nStandaard")?el("nStandaard").value:"0")==="1";
    const minG=bewaak?kgNaarGram(el("nMin")?el("nMin").value:""):0;
    const maxG=bewaak?kgNaarGram(el("nMax")?el("nMax").value:""):0;
    const eenh=el("nGlans").value||"stuk";
    const bc=normaliseerBarcode(el("nBarcode").value);
    if(bc&&!barcodeGeldig(bc)) return toast(t("tekensniet39")+" "+ongeldigeTekens(bc));

    const dubbel=db.artikelen.find(a=>a.categorie===categorie
      &&(a.leverancier||"").toLowerCase()===lev.toLowerCase()
      &&(a.merk||"").toLowerCase()===merk.toLowerCase()
      &&(a.naam||"").toLowerCase()===naam.toLowerCase()
      &&(a.maat||"")===maat);
    if(dubbel){
      boek(dubbel.id,"IN",totaal,{dozen:aantal});
      let gekoppeld=false;
      if(bc&&normaliseerBarcode(dubbel.barcode)!==bc){ dubbel.barcode=bc; dubbel.gewijzigd=Date.now(); gekoppeld=true; opslaan(); }
      staat.nieuwArtikel=false;
      toast(gekoppeld?t("bestondalgekoppeld"):t("bestondal"));
      return ga("voorraad",{artikelId:dubbel.id});
    }
    const a={id:nieuwId(db.artikelen),code:volgendeArtikelCode(),soort:"magazijn",
      categorie,leverancier:lev,merk,naam,maat,eenheid:eenh,icoon:gekozenIcoon,barcode:bc,
      standaard:bewaak,minVoorraadGram:minG,maxVoorraadGram:maxG,
      standaardGram:gram,voorraadGram:0,actief:true,
      gewijzigd:Date.now(),aangemaaktOp:new Date().toISOString().slice(0,10)};
    db.artikelen.push(a);
    boek(a.id,"IN",totaal,{dozen:aantal});
    staat.nieuwForm={}; staat.voorstelBarcode="";
    toast(catNaam(categorie)+" — "+kgTekst(totaal,a));
    return ga("voorraad",{artikelId:a.id});
  }

  if(el("nMerk")){
    // Nieuwe coating aanmaken en er meteen voorraad op zetten.
    const merk=el("nMerk").value.trim();
    const kleur=normaliseerKleur(el("nKleur").value);
    if(!merk) return toast(t("vulmerk"));
    if(!kleur) return toast(t("vulkleur"));
    const type=el("nType").value, soort=staat.nieuweSoort;
    const gu=glansGetal(el("nGlans").value);
    if(gu===null||gu<0||gu>100) return toast(t("gufout"));
    const glans=Math.round(gu);
    const bc=normaliseerBarcode(el("nBarcode").value);
    if(bc&&!barcodeGeldig(bc))
      return toast(t("tekensniet39")+" "+ongeldigeTekens(bc));

    const dubbel=db.artikelen.find(a=>a.soort===soort&&a.merk.toLowerCase()===merk.toLowerCase()
      &&a.type===type&&a.kleur.toLowerCase()===kleur.toLowerCase()&&glansGetal(a.glans)===glans);
    if(dubbel){
      boek(dubbel.id,"IN",totaal,{dozen:aantal});
      // De barcode alsnog vastleggen, anders blijft hij onbekend bij het scannen.
      let gekoppeld=false;
      if(bc&&normaliseerBarcode(dubbel.barcode)!==bc){ dubbel.barcode=bc; dubbel.gewijzigd=Date.now(); gekoppeld=true; opslaan(); }
      staat.nieuwArtikel=false;
      toast(gekoppeld?t("bestondalgekoppeld"):t("bestondal"));
      return ga("voorraad",{artikelId:dubbel.id});
    }

    const bewaak=(el("nStandaard")?el("nStandaard").value:"0")==="1";
    const info=ralInfo(kleur);
    const a={id:nieuwId(db.artikelen),code:volgendeArtikelCode(),soort,merk,type,kleur,glans,barcode:bc,
      serie:(el("nSerie")?el("nSerie").value:"").trim(),
      artikelnummer:(el("nArtnr")?el("nArtnr").value:"").trim(),
      standaard:bewaak,
      minVoorraadGram:bewaak?kgNaarGram(el("nMin")?el("nMin").value:""):0,
      maxVoorraadGram:bewaak?kgNaarGram(el("nMax")?el("nMax").value:""):0,
      kleurnaam:info?info.naam:"",hex:info?info.hex:"#6b6e6f",
      standaardGram:gram,voorraadGram:0,actief:true,
      gewijzigd:Date.now(),aangemaaktOp:new Date().toISOString().slice(0,10)};
    db.artikelen.push(a);
    boek(a.id,"IN",totaal,{dozen:aantal});
    staat.nieuwForm={}; staat.voorstelBarcode="";
    toast(soortNaam(soort)+" — "+kgTekst(totaal,a));
    ga("voorraad",{artikelId:a.id});
  }else{
    // Bestaande coating: alleen bijboeken.
    const a=artikel(staat.inboekArtikelId);
    if(!a) return toast(isMagazijn()?t("kiesartikel"):t("kiescoating"));
    if(gram!==a.standaardGram) a.standaardGram=gram;
    boek(a.id,"IN",totaal,{dozen:aantal});
    staat.inboekZoek=""; staat.inboekArtikelId=null;
    toast(kgTekst(totaal,a)+" "+t("bijgeboekt"));
    ga("voorraad",{artikelId:a.id});
  }
}

function exporteer(){
  // Alles bewaren: alle afdelingen, hun boekingen, checks, historie en instellingen.
  const blob=new Blob([JSON.stringify(bestand,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="geuzevoorraad-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href); toast(t("backupgedownload"));
}
function importeer(input){
  if(grendel()) return;
  // De variabele hieronder mag niet "bestand" heten: dat is de naam van de
  // gegevens zelf en die zou hij dan verbergen.
  const gekozen=input.files[0]; if(!gekozen) return;
  const lezer=new FileReader();
  lezer.onload=()=>{
    try{
      const n=JSON.parse(lezer.result);
      const nieuwStijl=n&&n.afdelingen;
      const oudeStijl=n&&Array.isArray(n.artikelen);
      if(!nieuwStijl&&!oudeStijl) throw new Error(t("geenbackup"));
      if(!confirm(t("vraagvervang"))) return;
      if(nieuwStijl){
        bestand=JSON.parse(JSON.stringify(n));
      }else{
        // Back-up van vroeger: één afdeling, die zetten we terug waar je nu staat.
        bestand.afdelingen[staat.afdeling]=Object.assign(legeAfdeling(),n);
      }
      bestand.instellingen=Object.assign({},LEEG.instellingen,bestand.instellingen||{});
      migreer(); opslaan(); kiesAfdeling(staat.afdeling); pasThemaToe();
      toast(t("backupingelezen")); ga("voorraad",{artikelId:null});
    }catch(e){ toast(t("inlezenmislukt")+" "+e.message); }
  };
  lezer.readAsText(gekozen); input.value="";
}
function wisAlles(){
  if(grendel()) return;
  if(!confirm(t("vraagwissen"))) return;
  if(!confirm(t("vraagzeker"))) return;
  // Let op: geen variabele "t" hier, die verbergt de vertaalfunctie t().
  const bewaardThema=bestand.instellingen.thema;
  const leeg=JSON.parse(JSON.stringify(LEEG));
  // Alleen de afdeling waar je in staat wordt geleegd, de rest blijft.
  bestand.afdelingen[staat.afdeling]=leeg.afdelingen[staat.afdeling]||legeAfdeling();
  bestand.instellingen.thema=bewaardThema;
  kiesAfdeling(staat.afdeling);
  opslaan(); ga("voorraad",{artikelId:null});
}

    db.artikelen.push(a);

    db.mutaties.push({id:nieuwId(db.mutaties),artikelId:a.id,type:"IN",gram:binnen,restGramNa:binnen,
      project:"",dozen:dozen,opmerking:"",
      datum:new Date(Date.now()-86400000*40).toISOString()});
    a.voorraadGram=binnen;
    const gebruikt=i%2===0?Math.round(inhoud*1000*0.55):0;
    if(gebruikt){
      a.voorraadGram-=gebruikt;
      db.mutaties.push({id:nieuwId(db.mutaties),artikelId:a.id,type:"UIT",gram:-gebruikt,
        restGramNa:a.voorraadGram,dozen:0,opmerking:"",
        datum:new Date(Date.now()-86400000*5).toISOString()});
    }
  });
  opslaan(); toast(t("voorbeeldgeladen")); ga("voorraad",{artikelId:null});
}
