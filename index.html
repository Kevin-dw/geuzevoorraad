<title>GeuzeVoorraad</title>
<style>
/* ============================================================
   ONTWERPTOKENS
   ============================================================ */
:root{
  --paginaBg:#0b0c0d; --schaal:#151617; --paneel:#1b1d1e; --kaart:#242627; --kaartHover:#2c2e2f;
  --rand:rgba(255,255,255,.07); --randSterk:rgba(255,255,255,.14);
  --tekst:#f1f2f2; --tekstZacht:#a6a9aa; --tekstFlauw:#8b8e8f;
  --lime:#3a4aa6; --limeDonker:#4a5cc4; --limeTekst:#8b99ec; --opLime:#ffffff;
  --limeZacht:rgba(58,74,166,.30);
  --groen:#2ecc71; --rood:#ff6b5e; --oranje:#ffb020;
  --r-groot:22px; --r-mid:14px; --r-klein:10px;
}
body.licht{
  --paginaBg:#e9eaec; --schaal:#fff; --paneel:#fff; --kaart:#f2f3f4; --kaartHover:#e8eaeb;
  --rand:rgba(0,0,0,.08); --randSterk:rgba(0,0,0,.17);
  --tekst:#101112; --tekstZacht:#5f6365; --tekstFlauw:#75797c;
  --limeTekst:#2b3a86; --limeZacht:#e4e8fa;
  /* Status- en accentkleuren die op wit leesbaar blijven. */
  --groen:#12813d; --rood:#c22d1e; --oranje:#9a6100;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  background:var(--paginaBg);color:var(--tekst);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--randSterk);border-radius:99px}
:focus-visible{outline:2px solid var(--limeTekst);outline-offset:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.01em}
.zacht{color:var(--tekstZacht)} .flauw{color:var(--tekstFlauw)} .klein{font-size:.78rem}
.opschrift{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tekstFlauw);font-weight:600}

.schil{display:grid;grid-template-columns:216px 1fr;height:100vh;height:100dvh;padding:10px;gap:10px}
.zijbalk{background:var(--schaal);border:1px solid var(--rand);border-radius:var(--r-groot);
  padding:18px 12px 12px;display:flex;flex-direction:column;overflow-y:auto}
.merk{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.merk img{width:32px;height:32px;object-fit:contain;flex:0 0 auto}
.merk b{font-size:.92rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.merk b span{display:block;font-size:.62rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tekstFlauw)}

.navlink{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
  border-radius:var(--r-klein);padding:11px;margin-bottom:3px;cursor:pointer;
  color:var(--tekstZacht);font-size:.9rem;font-weight:500}
.navlink:hover{background:var(--kaart);color:var(--tekst)}
.navlink.actief{background:var(--kaart);color:var(--tekst);font-weight:600}
.navlink svg{width:17px;height:17px;flex:0 0 auto;stroke-width:1.6}
.navlink .telling.waarschuwing{background:var(--oranje);color:#17181a;font-weight:700;
  min-width:20px;height:20px;border-radius:99px;display:inline-flex;
  align-items:center;justify-content:center;padding:0 6px;flex:0 0 auto}
.telling{margin-left:auto;font-size:.72rem;color:var(--tekstFlauw);font-variant-numeric:tabular-nums}

.zijvoet{margin-top:auto;padding-top:16px}
.themawissel{display:flex;background:var(--kaart);border-radius:99px;padding:4px;gap:2px;margin-top:6px}
.themawissel button{flex:1;border:0;background:none;border-radius:99px;padding:8px 6px;cursor:pointer;
  color:var(--tekstZacht);font-size:.8rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.themawissel button.actief{background:var(--paneel);color:var(--tekst)}
.themawissel svg{width:14px;height:14px;stroke-width:1.8}

/* min-height:0 is nodig, anders groeit deze kolom mee met een lange lijst
   en scrollt de hele pagina in plaats van alleen het lijstpaneel. */
.hoofd{display:flex;flex-direction:column;min-width:0;min-height:0;gap:10px;overflow:hidden}
.kop{display:flex;align-items:center;gap:10px;padding:6px 6px 0}
.kop h1{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;margin-right:auto}
.rondeknop{width:44px;height:44px;border-radius:50%;border:1px solid var(--rand);background:var(--paneel);
  display:grid;place-items:center;cursor:pointer;position:relative;flex:0 0 auto}
.rondeknop:hover{background:var(--kaart)}
.rondeknop svg{width:18px;height:18px;stroke-width:1.7}
.rondeknop.lime{background:var(--lime);border-color:var(--lime);color:var(--opLime)}
.rondeknop .stip{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:99px;
  background:var(--rood);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center;
  padding:0 5px;border:2px solid var(--paginaBg)}

.werkblad{flex:1;min-height:0;overflow:hidden}
.tweepaneel{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:10px;height:100%;min-height:0}
/* Eén kolom, gebruikt door inboeken en instellingen. */
.kolomsmal{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:10px;height:100%;min-height:0}
/* Panelen moeten kunnen krimpen, anders duwen ze het scherm breder dan de telefoon. */
.tweepaneel>*,.kolomsmal>*{min-width:0}
.paneel{background:var(--paneel);border:1px solid var(--rand);border-radius:var(--r-groot);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.paneel.detailpaneel,.paneel.scroll{overflow-y:auto}
.paneelkop{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;flex:0 0 auto}
.paneelkop h2{font-size:1.02rem;font-weight:600}
.paneelbody{padding:0 18px 18px;overflow-y:auto;flex:1;min-height:0}
.paneelbody.strak{padding-top:0}
.pil{background:var(--kaart);color:var(--tekstZacht);border-radius:99px;padding:2px 9px;
  font-size:.74rem;font-weight:600;font-variant-numeric:tabular-nums}
.pil.lime{background:var(--lime);color:var(--opLime)}

.zoek{position:relative;margin:0 18px 12px;flex:0 0 auto}
.zoek svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  stroke-width:1.8;color:var(--tekstFlauw)}
.zoek input{padding-left:36px}

input,select,textarea{width:100%;min-height:44px;padding:10px 13px;font:inherit;color:var(--tekst);
  background:var(--kaart);border:1px solid transparent;border-radius:var(--r-klein)}
input::placeholder{color:var(--tekstFlauw)}
input:focus,select:focus{outline:none;border-color:var(--randSterk);background:var(--paneel)}
select{appearance:none}
label.veld{display:block;margin-bottom:12px}
label.veld>span{display:block;font-size:.76rem;font-weight:600;color:var(--tekstZacht);margin-bottom:5px}
.raster2{display:grid;border:0;padding:0;margin:0;min-width:0;grid-template-columns:1fr 1fr;gap:0 12px}

.knop{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;
  border-radius:99px;cursor:pointer;font-weight:600;font-size:.88rem;background:var(--kaart);
  border:1px solid transparent;color:var(--tekst)}
.knop:hover{background:var(--kaartHover)}
.knop svg{width:16px;height:16px;stroke-width:1.8}
.knop.lime{background:var(--lime);border-color:var(--lime);color:var(--opLime)}
.knop.lime:hover{background:var(--limeDonker)}
.knop.rand{background:transparent;border-color:var(--randSterk)}
.knop.rand:hover{background:var(--kaart)}
.knop.rood{background:transparent;border-color:var(--rood);color:var(--rood)}
.knop.s{min-height:36px;padding:0 14px;font-size:.8rem}
.knop.breed{width:100%}
.knop[disabled]{opacity:.32;cursor:not-allowed}
.knoprij{display:flex;gap:8px;flex-wrap:wrap}
.knoprij.gelijk>.knop{flex:1}

.groep{margin:20px 0 6px;display:flex;align-items:center;gap:9px}
.groep:first-child{margin-top:4px}
.groep .streep{flex:1;height:1px;background:var(--rand)}
.groep .opschrift{font-size:.74rem;color:var(--tekst);letter-spacing:.1em}

.rij{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;padding:11px 8px;
  border-radius:var(--r-klein);cursor:pointer;border-left:3px solid transparent}
.rij:hover{background:var(--kaart)}
.rij.gekozen{background:var(--kaart);border-left-color:var(--limeTekst)}
.rij.dof{opacity:.45}
/* Vragen hebben geen kleurvlak; dan vervalt de eerste kolom. */
.rij.zonderstip{grid-template-columns:1fr auto}
.rij b{font-weight:600;font-size:.96rem;display:block;line-height:1.3;letter-spacing:-.01em}
.getal{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.getal.groot{font-size:1.2rem;display:block;line-height:1.3}

.stip{width:34px;height:34px;border-radius:10px;border:1px solid var(--randSterk);flex:0 0 auto}
.stip.s{width:20px;height:20px;border-radius:6px}
.stip.groot{width:46px;height:46px;border-radius:14px}
/* Magazijnartikelen krijgen een pictogram in plaats van een kleurvlak. */
.stip.icoon{display:inline-flex;align-items:center;justify-content:center;
  background:var(--kaart);color:var(--limeTekst)}
.stip.icoon svg{width:60%;height:60%}
/* Een vast kopblok bovenin een paneel; de lijst eronder krijgt de rest. */
.paneelbody.vast{flex:0 0 auto;overflow:visible;padding-bottom:4px}
.paneelbody.vast .richting{margin-bottom:10px}
/* Ongelezen bericht: een gevuld bolletje met het aantal, zoals in een chat. */
.nieuwbol{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  border-radius:99px;background:var(--lime);color:var(--opLime);font-size:.7rem;font-weight:700;padding:0 6px}
.rij.ongelezen b{font-weight:800}
.rij.ongelezen{background:var(--kaart)}
.detailkop .rondeknop{flex:0 0 auto}
/* Meldingen rechtsboven, boven alles heen. */
#meldingvak{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:400;
  display:flex;flex-direction:column;gap:8px;max-width:min(340px,calc(100vw - 24px))}
.melddoos{background:var(--paneel);border:1px solid var(--rand);border-radius:var(--r-mid);
  box-shadow:0 12px 34px rgba(0,0,0,.4);padding:11px 13px;animation:meldIn .22s ease-out}
@keyframes meldIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.meldkop{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.meldkop svg{width:16px;height:16px;color:var(--limeTekst);flex:0 0 auto}
.meldkop b{font-size:.84rem}
.meldkop .klein{margin-left:auto}
/* Groot genoeg om met een vinger te raken. */
.meldweg{border:0;background:none;color:var(--tekstFlauw);cursor:pointer;font-size:.9rem;
  width:32px;height:32px;margin:-6px -8px -6px 0;display:inline-flex;align-items:center;
  justify-content:center;flex:0 0 auto;border-radius:50%}
.meldweg:hover{background:var(--kaart);color:var(--tekst)}
.meldtekst{font-size:.86rem;line-height:1.4;cursor:pointer}
.meldtekst:hover{color:var(--limeTekst)}
.telbol{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
  border-radius:99px;background:var(--oranje);color:#17181a;font-size:.68rem;font-weight:700;
  padding:0 5px;margin-left:5px;vertical-align:1px}
.richting button.actief .telbol{background:rgba(255,255,255,.9);color:var(--lime)}
.laaglijst{display:flex;flex-direction:column;gap:10px}
.laagblok{display:flex;flex-direction:column;gap:6px}
/* Aantal, bestellen en genoeg-in-huis naast elkaar; op een smal scherm
   het invoerveld boven en de twee knoppen eronder naast elkaar. */
.laagbestel{display:grid;grid-template-columns:minmax(90px,1fr) auto auto;gap:8px;padding-left:37px}
@media (max-width:760px){
  .laagbestel{grid-template-columns:1fr 1fr}
  .laagbestel input{grid-column:1/-1}
}
.laagbestel input{min-width:0;min-height:38px;font-size:.84rem;
  background:var(--kaart);border:1px solid var(--rand);color:var(--tekst);
  border-radius:99px;padding:0 16px;font-family:inherit}
.laagbestel input:focus{outline:none;border-color:var(--lime)}
.laagbestel .knop{min-height:38px;padding:0 12px;font-size:.83rem;line-height:1.15;
  border:1px solid var(--rand);text-align:center}
.laagregel{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:center;
  background:var(--kaart);border:1px solid var(--rand);border-radius:var(--r-klein);padding:10px 12px}
.laagregel.klikbaar{cursor:pointer}
.laagregel.klikbaar:hover{border-color:var(--limeTekst)}
.laagnr{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:50%;background:var(--limeZacht);color:var(--limeTekst);
  font-size:.74rem;font-weight:700;flex:0 0 auto}
.laagvak{border:1px solid var(--rand);border-radius:var(--r-mid);padding:12px;margin-bottom:10px}
.laagkop{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.laagkop .opschrift{margin:0}
.bestelrij{display:grid;grid-template-columns:1fr auto;gap:8px}
.bestelrij input{background:var(--kaart);border:1px solid var(--rand);color:var(--tekst);
  border-radius:99px;padding:0 16px;min-height:44px;font:inherit;font-size:.88rem;min-width:0}
.bestelrij input:focus{outline:none;border-color:var(--lime)}
.bestelrij .knop{border:1px solid var(--rand)}
.laatstereactie{display:block;margin-top:2px;font-style:italic;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:100%}
/* Het vragenscherm blijft leesbaar breed, ook op een groot scherm. */
.vraagbody{max-width:760px;margin-inline:auto;width:100%}
.reacties{display:flex;flex-direction:column;gap:8px}
/* Alles waarmee je antwoordt staat bij elkaar in één vak. */
.antwoordvak{margin-top:18px;border:1px solid var(--rand);border-radius:var(--r-mid);
  padding:12px;display:flex;flex-direction:column;gap:10px}
.antwoordvak .knop{margin:0}
/* De snelle antwoorden houden hun eigen vlak, zodat ze knoppen blijven. */
.antwoordvak .snelrij .knop{border:1px solid var(--rand)}
/* De afsluitende knoppen staan los, achter een scheidingslijn. */
.afsluitrij{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--rand)}
.afsluitrij .knop{flex:1}
.knop.stilrood{background:none;border:1px solid var(--rand);color:var(--rood)}
.knop.stilrood:hover{border-color:var(--rood)}
.reactie{background:var(--kaart);border:1px solid var(--rand);border-radius:var(--r-klein);
  padding:9px 12px;font-size:.87rem;line-height:1.45}
.reactie .klein{margin-bottom:2px}
textarea{width:100%;background:var(--kaart);border:1px solid var(--rand);color:var(--tekst);
  border-radius:var(--r-klein);padding:10px 12px;font:inherit;font-size:.92rem;resize:vertical}
textarea:focus{outline:none;border-color:var(--lime)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.icoonrij{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.icoonknop{width:40px;height:40px;border-radius:10px;cursor:pointer;padding:0;
  background:var(--kaart);border:1px solid var(--rand);color:var(--tekstZacht);
  display:inline-flex;align-items:center;justify-content:center}
.icoonknop svg{width:22px;height:22px}
.icoonknop .autotekst{font-size:.6rem;font-weight:700;letter-spacing:.02em;padding:0 3px;
  line-height:1.1;text-align:center}
.icoonknop.actief{background:var(--lime);color:var(--opLime);border-color:var(--lime)}
.stip.icoon.s svg{width:68%;height:68%}

.merkje{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;
  font-size:.7rem;font-weight:600}
.merkje.groen{background:rgba(46,204,113,.15);color:var(--groen)}
.merkje.oranje{background:rgba(230,145,56,.18);color:var(--oranje)}
.merkje.rood{background:rgba(255,107,94,.15);color:var(--rood)}
.merkje.lime{background:var(--limeZacht);color:var(--limeTekst)}
.merkje.neutraal{background:var(--kaart);color:var(--tekstZacht)}
body.licht .merkje.lime{background:var(--limeZacht);color:var(--limeTekst)}

.niets{text-align:center;color:var(--tekstFlauw);padding:26px 14px;font-size:.85rem;line-height:1.6}

.limekaart{background:var(--lime);color:var(--opLime);border-radius:var(--r-groot);
  padding:16px 18px;margin:12px 18px 18px;flex:0 0 auto}
.limekaart .kop2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.limekaart h3{font-size:.95rem;font-weight:700}
.limekaart .vakjes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.limekaart .cel{background:rgba(255,255,255,.13);border-radius:var(--r-mid);padding:11px 13px;min-width:0;
  overflow:hidden}
.limekaart .cijfer{font-size:1.7rem;font-weight:800;line-height:1.05;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.limekaart .bijschrift{font-size:.71rem;font-weight:600;opacity:.8;white-space:nowrap}
.stippenrij{display:flex}
.stippenrij i{width:22px;height:22px;border-radius:7px;border:2px solid var(--lime);margin-left:-7px;display:block}
.stippenrij i:first-child{margin-left:0}

.detailkop{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 12px;flex-wrap:wrap;
  position:sticky;top:0;z-index:3;background:var(--paneel)}
.detailkop .titelblok{margin-right:auto;min-width:0}
.detailkop h2{font-size:1.45rem;font-weight:700;letter-spacing:-.02em}
.spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}

.artikelbalk{display:flex;align-items:center;gap:13px;background:var(--kaart);border-radius:var(--r-mid);
  padding:13px 15px;margin:0 18px;flex:0 0 auto}
.artikelbalk .stapel{margin-right:auto;min-width:0}

.hoeveelheid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:14px 18px 0}
.hoeveelheid .vlak{background:var(--kaart);border-radius:var(--r-mid);padding:14px 16px;min-width:0}
.hoeveelheid .datum{font-size:.72rem;color:var(--tekstFlauw);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hoeveelheid .waarde{font-size:1.45rem;font-weight:700;letter-spacing:-.02em}
.hoeveelheid .midden{background:var(--kaart);border:1px solid var(--rand);border-radius:99px;
  padding:7px 13px;font-size:.76rem;font-weight:700;white-space:nowrap}

.vakken{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px 18px}
.vak{background:var(--kaart);border-radius:var(--r-mid);padding:15px}
.vak h4{margin-bottom:12px}
.uitklap{padding:0}
.uitklap>summary{list-style:none;cursor:pointer;padding:15px;display:flex;align-items:center;gap:9px;
  border-radius:var(--r-mid);user-select:none}
.uitklap>summary::-webkit-details-marker{display:none}
.uitklap>summary:hover{background:var(--kaartHover)}
.uitklap>summary .pijl{margin-left:auto;transition:transform .15s;color:var(--tekstFlauw);
  display:grid;place-items:center}
.uitklap>summary .pijl svg{width:15px;height:15px;stroke-width:2}
.uitklap[open]>summary .pijl{transform:rotate(180deg)}
.uitklap>.inhoud{padding:0 15px 15px}

.tijdlijn{position:relative;padding-left:18px;max-height:300px;overflow-y:auto}
.tijdlijn:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;border-left:2px dotted var(--randSterk)}
.geb{position:relative;margin-bottom:11px}
.geb:last-child{margin-bottom:0}
.geb:before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--limeTekst);border:2px solid var(--kaart)}
.geb.uit:before{background:var(--rood)}
.geb.correctie:before{background:var(--oranje)}
.geb .wanneer{font-size:.71rem;color:var(--tekstFlauw);margin-bottom:3px}
.geb .doosje{background:var(--paneel);border:1px solid var(--rand);border-radius:var(--r-klein);
  padding:9px 11px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
/* De omschrijving mag inkorten; de bedragen moeten heel blijven. */
.geb .doosje b{font-size:.83rem;font-weight:600;margin-right:auto;min-width:0;flex:1 1 auto}
.geb .doosje .bedrag,.geb .doosje .klein{flex:0 0 auto;white-space:nowrap}
.geb .bedrag{font-weight:700;font-variant-numeric:tabular-nums;font-size:.83rem}

.snelrij{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.snelrij .knop{padding:0 4px;font-size:.82rem}
.richting{display:flex;flex-wrap:wrap;background:var(--paneel);border-radius:22px;padding:4px;gap:3px;margin-bottom:14px}
.richting button{flex:1 1 90px;min-width:0;border:0;background:none;border-radius:99px;padding:11px 6px;
  cursor:pointer;font-size:.85rem;font-weight:600;color:var(--tekstZacht);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
/* Een pictogram in zo'n knop moet klein blijven, anders rekt de knop op. */
.richting button svg{width:17px;height:17px;flex:0 0 auto}
.richting button.actief{background:var(--lime);color:var(--opLime)}
.richting button[disabled]{opacity:.4;cursor:not-allowed}
.richting.opKaart{background:var(--kaart)}

.bevestigvak{background:var(--paneel);border:1px solid var(--randSterk);border-radius:var(--r-mid);
  padding:12px 14px;font-size:.85rem;line-height:1.5}
.bevestigvak .regel{font-size:1.02rem;font-weight:600;margin-bottom:3px}
.bevestigvak.leeg{border-style:dashed;color:var(--tekstFlauw);font-size:.8rem}
.bevestigvak.fout{border-color:var(--rood);color:var(--rood)}

#overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.66);
  place-items:center;padding:20px}
#overlay.aan{display:grid}
.bestelmail{background:var(--paneel);border:1px solid var(--randSterk);border-radius:var(--r-groot);
  width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.bmkop{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--rand)}
.bmkop h2{font-size:1.14rem;margin-top:2px}
.bmkop .rondeknop{margin-left:auto;flex:0 0 auto}
.bmbody{padding:16px 20px 20px;overflow-y:auto}
.bmbody textarea{font-size:.86rem;line-height:1.5;min-height:200px}
.bestelknop{margin-left:auto;min-height:32px;padding:0 12px;font-size:.78rem;
  border:1px solid var(--rand);flex:0 0 auto}
.bestelknop svg{width:14px;height:14px}
.groep{gap:9px}
.herinnering{background:var(--paneel);border:1px solid var(--randSterk);border-radius:var(--r-groot);
  padding:26px 26px 22px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
.herinnering .teken{width:56px;height:56px;border-radius:50%;background:var(--lime);color:var(--opLime);
  display:grid;place-items:center;margin:0 auto 16px;font-size:1.9rem;font-weight:800}
.herinnering h2{font-size:1.22rem;font-weight:700;line-height:1.35;margin-bottom:10px}
.herinnering p{color:var(--tekstZacht);font-size:.88rem;margin-bottom:20px;line-height:1.55}
.herinnering .wat{background:var(--kaart);border-radius:var(--r-mid);padding:11px 14px;
  margin-bottom:18px;font-size:.9rem}

.keuzeknoppen{display:grid;gap:9px}
.keuzeknop{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
  background:var(--paneel);border:1px solid var(--randSterk);border-radius:var(--r-mid);padding:14px 15px;
  color:var(--tekst)}
.keuzeknop:hover{border-color:var(--limeTekst);background:var(--kaartHover)}
.keuzeknop .teken{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:1.5rem;font-weight:700;background:rgba(255,107,94,.15);color:var(--rood)}
.keuzeknop .teken.op{background:rgba(46,204,113,.15);color:var(--groen)}
.keuzeknop b{display:block;font-size:.95rem;font-weight:600}
.keuzeknop .klein{display:block}
.modusbalk{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modusbalk .merkje{font-size:.78rem;padding:5px 11px}
.modusbalk .knop{margin-left:auto}
.gepauzeerd{background:var(--kaart);border:1px dashed var(--randSterk);border-radius:var(--r-mid);
  padding:26px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.kieslijst{max-height:230px;overflow-y:auto;margin-bottom:14px;
  border:1px solid var(--rand);border-radius:var(--r-mid);padding:4px}
.kieslijst .rij{grid-template-columns:26px 1fr auto}
.afdbalk{display:flex;align-items:center;gap:10px;padding:0 6px;flex-wrap:wrap}
.afdbalk .afdnaam{font-size:.8rem;font-weight:600;color:var(--tekstZacht)}
.afdbalk .knop{margin-left:auto}
.afdkeuze{display:flex;background:var(--kaart);border:1px solid var(--rand);border-radius:99px;padding:3px;gap:3px}
.afdkeuze button{border:0;background:none;border-radius:99px;padding:5px 13px;cursor:pointer;
  font-size:.78rem;font-weight:600;color:var(--tekstZacht)}
.afdkeuze button.actief{background:var(--lime);color:var(--opLime)}
.syncknop{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rand);
  background:var(--kaart);color:var(--tekstZacht);border-radius:99px;padding:5px 12px;
  font-size:.74rem;font-weight:600;cursor:pointer;flex:0 0 auto}
.syncknop .bolletje{width:8px;height:8px;border-radius:50%;background:var(--tekstFlauw)}
.syncknop.live .bolletje{background:var(--groen);box-shadow:0 0 7px var(--groen)}
.syncknop.fout{border-color:var(--rood);color:var(--rood)}
.syncknop.fout .bolletje{background:var(--rood)}
.syncknop.lokaal{border-color:var(--oranje);color:var(--oranje)}
.syncknop.lokaal .bolletje{background:var(--oranje)}
.syncbalk{display:flex;align-items:center;gap:12px;margin:0 6px 8px}
.syncbalk .knop{flex:0 0 auto}
.syncbalk>div{margin-right:auto}
.syncbalk{flex-wrap:wrap}
/* Naam links, aan/uit rechts, ook als het paneel smal is. */
.scanrij{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.scanrij>span{font-size:.9rem;font-weight:600;flex:1 1 90px;min-width:0}
.scanrij .richting{flex:0 0 auto;width:auto;padding:3px;margin:0;flex-wrap:nowrap}
.scanrij .richting button{flex:0 0 auto;padding:0 16px;min-height:34px;font-size:.82rem;white-space:nowrap}

/* Natlak krijgt groene accenten in plaats van blauwe. */
body.natlak{--lime:#2f8a4f; --limeDonker:#37a05c; --limeTekst:#5fce8b;
  --limeZacht:rgba(47,138,79,.30)}
body.magazijn{--lime:#b03a34; --limeDonker:#c8443d; --limeTekst:#f0908a;
  --limeZacht:rgba(176,58,52,.30)}
body.natlak.licht{--limeTekst:#17663a; --limeZacht:#dcf0e4}
body.magazijn.licht{--limeTekst:#8f2620; --limeZacht:#f7e0de}

/* Alleen kijken: knoppen die iets zouden veranderen zijn er niet. */
body.kijken .verbergBijKijken{display:none !important}
body.nietboeken .nietBoeken{display:none !important}

body.uitgelogd .zijbalk,body.uitgelogd .kop,body.uitgelogd .afdbalk,
body.uitgelogd .onderbalk{display:none !important}
body.uitgelogd .schil{grid-template-columns:1fr}
.inlogvak{max-width:340px;margin:8vh auto;background:var(--paneel);border:1px solid var(--rand);
  border-radius:var(--r-groot);padding:30px 26px;text-align:center}
.inlogvak h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
.inloglogo{width:52px;height:52px;object-fit:contain;margin-bottom:16px}
.inlogvak .melding{margin-top:-4px}
.taalkeuze{width:auto;min-height:30px;padding:3px 26px 3px 9px;font-size:.76rem;font-weight:600;
  margin-left:auto;background:var(--kaart);border:1px solid var(--rand);border-radius:99px;
  background-image:linear-gradient(45deg,transparent 50%,var(--tekstFlauw) 50%),
    linear-gradient(135deg,var(--tekstFlauw) 50%,transparent 50%);
  background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;appearance:none}
.camknoppen{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.camknoppen .zoomregel{display:flex;align-items:center;gap:8px;flex:1;min-width:140px}
.camknoppen input[type=range]{flex:1;min-height:0;padding:0;background:none;border:0;accent-color:var(--limeTekst)}
.melding{border-radius:var(--r-mid);padding:12px 14px;font-size:.82rem;line-height:1.5;margin-bottom:12px}
.melding.info{background:var(--kaart);color:var(--tekstZacht)}
.melding.let{background:rgba(255,176,32,.12);color:var(--oranje)}
.melding.fout{background:rgba(255,107,94,.12);color:var(--rood)}

video#video{width:100%;max-height:50vh;background:#000;border-radius:var(--r-mid);object-fit:cover;display:block}
.scanvak{position:relative}
.scanvak .richtkader{position:absolute;left:3%;right:3%;top:35%;height:30%;
  border:2px solid var(--limeTekst);border-radius:8px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);
  pointer-events:none}
.scanvak .richtkader span{position:absolute;left:0;right:0;bottom:-22px;
  text-align:center;font-size:.72rem;font-weight:600;color:var(--limeTekst);text-shadow:0 1px 3px #000}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;background:var(--lime);
  color:var(--opLime);padding:12px 22px;border-radius:99px;font-size:.86rem;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:90vw;text-align:center}

.vinkrij{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:var(--r-klein);cursor:pointer}
.vinkrij:hover{background:var(--kaart)}
.vinkrij input{width:19px;height:19px;min-height:0;flex:0 0 auto;accent-color:var(--limeTekst)}

.onderbalk{display:none}
.alleenmobiel{display:none}
.mobielmerk{display:none;align-items:center;gap:9px;padding:4px 6px 0}
.mobielmerk img{width:26px;height:26px;object-fit:contain;flex:0 0 auto}
.mobielmerk b{font-size:.85rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.mobielmerk b span{display:block;font-size:.58rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tekstFlauw)}

@media (max-width:1000px){
  .schil{grid-template-columns:1fr;height:auto;min-height:100dvh;padding:8px;
    padding-top:calc(8px + env(safe-area-inset-top));
    padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .zijbalk{display:none}
  .mobielmerk{display:flex}
  .kop{padding-top:2px}
  .kop h1{font-size:1.32rem}
  .alleenmobiel{display:inline-flex}
  .werkblad{overflow:visible}
  .hoofd{min-height:auto;overflow:visible}
  /* De melding mag de onderbalk niet bedekken. */
  .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  .tweepaneel,.kolomsmal{grid-template-columns:1fr;height:auto}
  .paneel,.paneelbody,.paneel.scroll,.paneel.detailpaneel{overflow:visible}
  .kolomsmal .paneel{overflow:visible}
  .tijdlijn{max-height:none}
  body.gesplitst .tweepaneel>.detailpaneel{display:none}
  body.gesplitst.detail-open .tweepaneel>.lijstpaneel{display:none}
  body.gesplitst.detail-open .tweepaneel>.detailpaneel{display:flex}
  .vakken{grid-template-columns:1fr}
  .hoeveelheid{grid-template-columns:1fr}
  .hoeveelheid .midden{justify-self:start}
  .onderbalk{display:flex;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));
    z-index:100;background:var(--schaal);border:1px solid var(--rand);border-radius:20px;padding:6px;gap:3px;
    box-shadow:0 8px 26px rgba(0,0,0,.4)}
  .onderbalk button{flex:1;border:0;background:none;border-radius:15px;padding:9px 2px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tekstFlauw);
    font-size:.68rem;font-weight:600}
  .onderbalk button svg{width:20px;height:20px;stroke-width:1.7}
  .onderbalk button.actief{background:var(--kaart);color:var(--limeTekst)}
}
@media (max-width:520px){ .raster2{grid-template-columns:1fr} }

/* Wordt het scherm met een vinger bediend, dan moet alles ruim genoeg zijn.
   Apple houdt 44 punten aan als minimum; dit haalt de kleine knoppen daarboven. */
@media (pointer:coarse){
  .knop.s{min-height:42px;padding:10px 16px}
  .richting button{padding:12px 8px}
  .afdkeuze button{min-height:42px;padding:10px 16px}
  .themawissel button{min-height:42px}
  .taalkeuze{min-height:40px}
}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

/* ============================================================
   2b. CODE 39 LEZEN — eigen lezer, werkt in elke browser en offline
   ============================================================ */
const C39_TERUG=(()=>{const m={};for(const k in C39) m[C39[k]]=k; return m;})();

/** Bepaalt de zwart/wit-lengtes van één lijn, met randen op subpixelniveau.
 *  Dat laatste is wat een licht onscherpe foto toch leesbaar maakt. */
function lijnNaarRuns(grijs,n,offset){
  if(n<40) return null;
  // meebewegende drempel vangt schaduw en ongelijke belichting op
  const cum=new Float32Array(n+1);
  for(let i=0;i<n;i++) cum[i+1]=cum[i]+grijs[i];
  const half=Math.max(6,Math.round(n/50));
  const verschil=new Float32Array(n);
  let spreiding=0;
  for(let i=0;i<n;i++){
    const a=Math.max(0,i-half), b=Math.min(n,i+half+1);
    verschil[i]=grijs[i]-((cum[b]-cum[a])/(b-a))+offset;
    if(Math.abs(verschil[i])>spreiding) spreiding=Math.abs(verschil[i]);
  }
  if(spreiding<6) return null;                 // vlak vlak, hier staat geen barcode

  // overgangen zoeken en het snijpunt interpoleren
  const randen=[]; let zwartEerst=verschil[0]<0;
  for(let i=1;i<n;i++){
    const a=verschil[i-1], b=verschil[i];
    if((a<0)!==(b<0)) randen.push(i-1+Math.abs(a)/(Math.abs(a)+Math.abs(b)));
  }
  if(randen.length<14) return null;
  const runs=[];
  for(let i=1;i<randen.length;i++){
    // De eerste rand wisselt de kleur van het eerste beeldpunt om.
    const k=i-1;
    runs.push({kleur:zwartEerst?(k%2):(1-k%2),lengte:randen[i]-randen[i-1]});
  }
  return runs;
}

/** Negen elementen worden een teken; de drie breedste zijn de brede. */
function herkenTeken(b){
  let min=Infinity,max=0;
  for(const w of b){ if(w<min)min=w; if(w>max)max=w; }
  if(max<min*1.3) return null;
  const drempel=(min+max)/2;
  let breed=0, sleutel="";
  for(const w of b){ const g=w>drempel; if(g) breed++; sleutel+=g?"w":"n"; }
  if(breed!==3) return null;
  return C39_TERUG[sleutel]||null;
}

function decodeerRuns(runs,rapport,uiterlijk){
  for(let s=0;s+9<=runs.length;s++){
    // De bewaking moet hier zitten: één rommelige lijn kan anders seconden kosten.
    if(uiterlijk&&(s&31)===0&&performance.now()>uiterlijk) return null;
    if(runs[s].kleur!==1) continue;            // een teken begint altijd met een streep
    const tekens=[];
    let i=s;
    while(i+9<=runs.length){
      const p=[];
      for(let j=0;j<9;j++) p.push(runs[i+j].lengte);
      const t=herkenTeken(p);
      if(!t) break;
      tekens.push(t);
      if(rapport){
        if(tekens.length>rapport.tekens) rapport.tekens=tekens.length;
        if(t==="*") rapport.ster=true;
      }
      if(t==="*"&&tekens.length>1){
        if(tekens[0]!=="*") break;
        const tekst=tekens.slice(1,-1).join("");
        if(tekst.length) return tekst;
        break;
      }
      i+=10;                                    // negen elementen plus de scheidingsspatie
    }
  }
  return null;
}

/** Leest een barcode uit een beeldbron (video, foto of canvas). */
function leesCode39(bron,opties){
  const o=opties||{};
  const bw=bron.videoWidth||bron.width, bh=bron.videoHeight||bron.height;
  if(!bw||!bh) return null;
  // Alleen een strook in het midden bekijken. Dat is waar de gebruiker op richt,
  // en het scheelt zoveel rekenwerk dat het beeld op volle scherpte kan blijven.
  const band=o.band||1;
  const sy=Math.round(bh*(1-band)/2), sh=Math.max(20,Math.round(bh*band));
  const schaal=Math.min(1,(o.maxBreedte||1800)/bw);
  const w=Math.round(bw*schaal), h=Math.round(sh*schaal);
  if(w<60||h<20) return null;

  const doek=o.doek||document.createElement("canvas");
  doek.width=w; doek.height=h;
  const ctx=doek.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(bron,0,sy,bw,sh,0,0,w,h);
  const beeld=ctx.getImageData(0,0,w,h).data;

  // grijswaarden in één keer, daarna alleen nog uitlezen
  const grijs=new Float32Array(w*h);
  for(let i=0,j=0;j<w*h;i+=4,j++)
    grijs[j]=beeld[i]*0.299+beeld[i+1]*0.587+beeld[i+2]*0.114;

  // Een tijdslimiet houdt de app soepel: liever vaak een korte poging dan
  // één lange waarin het beeld stilstaat. Per poging worden andere lijnen
  // bekeken, zodat over een paar beelden alles aan bod komt.
  const begin=performance.now(), limiet=o.tijdslimiet||0;
  const lijnen=o.lijnen||81;
  // Meerdere naast elkaar liggende beeldlijnen middelen. Ruis en onscherpte
  // middelen zo weg, wat vooral scheelt bij een minder scherpe camera.
  const dikte=Math.max(1,o.dikte||1), halfD=dikte>>1;
  // Hoe ver de scanlijnen boven en onder het midden worden gelegd. Een barcode is
  // een dunne strook, dus dicht bij het midden zoeken levert veel meer treffers.
  const spreiding=o.spreiding===undefined?0.8:o.spreiding;
  const hoeken=o.hoeken||[0,7,-7,14,-14,21,-21];
  const offsets=o.offsets||[0,10,-10];
  const buffer=new Float32Array(w);

  for(const offset of offsets){
    for(const hoek of hoeken){
      const helling=Math.tan(hoek*Math.PI/180);
      for(let n=0;n<lijnen;n++){
        if(limiet&&performance.now()-begin>limiet) return null;
        const m=(n+(o.fase||0))%lijnen;
        const rel=(m%2?-1:1)*Math.ceil(m/2)/(lijnen+1);
        const y0=h*(0.5+rel*spreiding);
        let geldig=0;
        for(let x=0;x<w;x++){
          const mid=Math.round(y0+helling*(x-w/2));
          let som=0,tel=0;
          for(let d=-halfD;d<=halfD;d++){
            const y=mid+d;
            if(y<0||y>=h) continue;
            som+=grijs[y*w+x]; tel++;
          }
          if(!tel){ buffer[x]=buffer[x>0?x-1:0]; continue; }
          buffer[x]=som/tel; geldig++;
        }
        if(geldig<w*0.7) continue;
        const runs=lijnNaarRuns(buffer,w,offset);
        if(!runs||runs.length>900) continue;
        if(o.rapport&&runs.length>o.rapport.randen) o.rapport.randen=runs.length;
        const uiterlijk=limiet?begin+limiet:0;
        let t=decodeerRuns(runs,o.rapport,uiterlijk);
        if(t) return t;
        // omgekeerd gehouden: de lijst omdraaien zet alles weer goed
        t=decodeerRuns(runs.slice().reverse(),o.rapport,uiterlijk);
        if(t) return t;
      }
    }
  }
  return null;
}

}

/** De kleurnaam in de gekozen taal; valt terug op het Nederlands. */
function ralNaam(kleur){
  const info=ralInfo(kleur);
  if(!info) return "";
  const taal=huidigeTaal();
  if(taal==="nl") return info.naam;
  const nr=String(kleur).replace(/\D/g,"");
  const r=RAL_TALEN[nr];
  return (r&&r[taal])||info.naam;
}

/* De glansgraad is een meetwaarde in Gloss Units, gemeten bij 60° (ISO 2813).
   Oudere regels bevatten nog een woord; die worden bij het inlezen omgezet naar
   het midden van het bijbehorende bereik. */
const GLANS_UIT_WOORD={
  "Mat":10,"Supermat":5,"Doodmat":5,"Zijdemat":25,"Eiglans":25,
  "Zijdeglans":45,"Satin":45,"Halfglans":70,"Glans":75,"Hoogglans":90,
  "Matt":10,"Semi-matt":25,"Satijn":45,"Gloss":75,"High gloss":90
};
const glansGetal=x=>{
  if(typeof x==="number") return x;
  const n=parseFloat(String(x).replace(",","."));
  if(!isNaN(n)) return n;
  return GLANS_UIT_WOORD[x]!==undefined?GLANS_UIT_WOORD[x]:null;
};
const glansNaam=x=>{
  const n=glansGetal(x);
  return n===null?String(x||""):String(Math.round(n))+" GU";
};

const MAG_CAT_ICOON={
  "PBM":"handschoen","Spuiten/coaten":"spuit","Spuitbussen":"spuitbus","Touch-up set":"blik",
  "Schuren":"schuur","Stralen":"schuur","Slijpen":"slijpschijf","Tape":"tape","Verpakken":"folie",

};

/** Kiest het passende pictogram bij een magazijnartikel. */
function magIcoonNaam(a){
  if(a&&a.icoon&&MAG_ICONEN[a.icoon]) return a.icoon;
  // Bij spuitbussen zegt de categorie het al; de kleurnaam mag niet storen.
  if(a&&a.categorie==="Spuitbussen") return "spuitbus";
  // De omschrijving telt mee: daar staat vaak pas wat het echt is.
  const tekst=[(a&&a.naam)||"",(a&&a.maat)||"",(a&&a.merk)||""].join(" ");
  for(const [patroon,naam] of MAG_WOORDEN) if(patroon.test(tekst)) return naam;
  return MAG_CAT_ICOON[a&&a.categorie]||"doos";
}
/** Rijtje om zelf een pictogram te kiezen; leeg betekent: laat de app kiezen. */
function icoonKiezer(gekozen,veldId){
  const auto=`<button type="button" class="icoonknop ${gekozen?"":"actief"}"
      title="${t("vanzelf")}" onclick="app.kiesIcoon('${veldId}','')">
      <span class="autotekst">${t("vanzelf")}</span></button>`;
  const rest=Object.keys(MAG_ICONEN).map(k=>
    `<button type="button" class="icoonknop ${gekozen===k?"actief":""}" title="${k}"
       onclick="app.kiesIcoon('${veldId}','${k}')">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">${MAG_ICONEN[k]}</svg></button>`).join("");
  return `<div class="icoonrij" id="${veldId}rij">${auto}${rest}</div>
    <input type="hidden" id="${veldId}" value="${esc(gekozen||"")}">`;
}
function kiesIcoon(veldId,naam){
  const veld=document.getElementById(veldId);
  if(veld) veld.value=naam;
  const rij=document.getElementById(veldId+"rij");
  if(!rij) return;
  [...rij.children].forEach((b,i)=>{
    const eigen=i===0?"":Object.keys(MAG_ICONEN)[i-1];
    b.classList.toggle("actief",eigen===naam);
  });
}

function magIcoon(a,klasse){
  const d=MAG_ICONEN[magIcoonNaam(a)]||MAG_ICONEN.doos;
  return `<span class="stip icoon ${klasse||""}"><svg viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${d}</svg></span>`;
}

function kgNaarGram(kg){
  const n=parseFloat(String(kg).replace(",",".")); return isNaN(n)?0:Math.round(n*1000);
}
const gramNaarKg=g=>(g/1000).toFixed(3).replace(".",",").replace(/,?0+$/,"")||"0";
/* De voorraad wordt intern altijd in duizendsten bijgehouden: gram bij
   poedercoating, milliliter bij natlak. Alleen de aanduiding verschilt. */
const kgTekst=(g,a)=>gramNaarKg(g)+" "+(a?artEenheid(a,g):eenheidBij(g));

/* ============================================================
   6. OPSLAG
   Sommige omgevingen (een voorbeeldvenster in een website) blokkeren
   localStorage. Dan werkt de app gewoon door, alleen zonder bewaren.
   ============================================================ */
const SLEUTEL="geuzevoorraad_v2";
const VERSIE="2026-08-18 · v57";

/* ============================================================
   AFDELINGEN — poedercoating en natlak hebben elk een eigen voorraad
   in hetzelfde bestand. `bestand` is alles, `db` wijst naar de afdeling
   waar je nu in werkt.
   ============================================================ */
const AFDELINGEN={
  poeder:  {naam:"Poedercoating", eenheid:"kg",    accent:"#3a4aa6"},
  natlak:  {naam:"Natlak",        eenheid:"liter", accent:"#2f8a4f"},
  magazijn:{naam:"Magazijn",      eenheid:"stuk",  accent:"#b03a34"}
};
/* Het magazijn werkt met tellbare spullen in plaats van coating: daar horen
   andere velden bij (omschrijving, maat, verpakking) en hele aantallen. */
const isMagazijn=()=>staat.afdeling==="magazijn";
const legeAfdeling=()=>({artikelen:[],mutaties:[],vragen:[],historie:[],tellers:{artikel:0}});
const LEEG={
  afdelingen:{poeder:legeAfdeling(),natlak:legeAfdeling(),magazijn:legeAfdeling()},
  beheer:{scannen:{poeder:true,natlak:true,magazijn:true},gewijzigd:0},
  instellingen:{thema:"donker",taal:"nl",syncUrl:"",syncSleutel:"",syncSoort:"firebase",geluid:true}
};

/* ============================================================
   GEBRUIKERS — vier vaste accounts. Kantoor mag alles zien maar
   niets wijzigen; dat wordt op één plek afgedwongen (magWijzigen).
   ============================================================ */
const GEBRUIKERS={
  "Admin2026":      {naam:"Admin",         rol:"admin",   afdelingen:["poeder","natlak","magazijn"], wijzigen:true},
  "Poedercoat2026": {naam:"Poedercoating", rol:"afdeling",afdelingen:["poeder"],          wijzigen:true},

  "Kantoor2026":    {naam:"Kantoor",       rol:"kijken",  afdelingen:["poeder","natlak","magazijn"], wijzigen:false}
};
let gebruiker=null;
/* Twee rechten naast elkaar:
   - boeken: voorraad in- en uitboeken, gegevens wissen of inlezen
   - bewerken: de gegevens van een artikel aanpassen
   Kantoor mag in het magazijn wel bewerken, maar nergens boeken. */
const magBoeken=()=>!!(gebruiker&&gebruiker.wijzigen);
/* Scannen kan per afdeling uitgezet worden; de beheerder bepaalt dat.
   Staat het uit, dan verdwijnen alle scanknoppen en gaat boeken via de lijst. */
/* Beheerinstellingen gelden voor het hele bedrijf en gaan daarom mee met de
   synchronisatie. De gewone instellingen (taal, thema, sync-adres) blijven
   juist per apparaat. */
function beheerDeel(){
  if(!bestand.beheer) bestand.beheer={scannen:{poeder:true,natlak:true,magazijn:true},gewijzigd:0};
  if(!bestand.beheer.scannen) bestand.beheer.scannen={poeder:true,natlak:true,magazijn:true};
  return bestand.beheer;
}
function scanAan(afd){
  const s=beheerDeel().scannen;
  const w=s[afd||staat.afdeling];
  return w===undefined?true:!!w;
}
const magScannen=()=>magBoeken()&&scanAan();
function zetScannen(afd,aan){
  if(!gebruiker||gebruiker.rol!=="admin") return toast(t("alleenadmin"));
  const bh=beheerDeel();
  bh.scannen[afd]=aan;
  bh.gewijzigd=Date.now();
  if(!aan&&afd===staat.afdeling){ staat.uitScan=false; stopCamera(); }
  opslaan(); teken();
}
const magBewerken=()=>!!(gebruiker&&(gebruiker.wijzigen||(gebruiker.rol==="kijken"&&isMagazijn())));
const magWijzigen=magBoeken;
const afdInfo=()=>AFDELINGEN[staat.afdeling]||AFDELINGEN.poeder;
const eenheid=()=>t(staat.afdeling==="natlak"?"liter":staat.afdeling==="magazijn"?"stuk":"kg");
/** Zelfde eenheid, maar in het meervoud waar de taal dat vraagt. */
const eenheidBij=n=>{
  if(staat.afdeling==="poeder") return t("kg");
  const enkel=Math.abs(n)===1000;   // duizendsten: 1000 is precies één
  if(staat.afdeling==="natlak") return t(enkel?"liter":"literm");
  return t(enkel?"stuk":"stukm");
};
/** Verpakking: dozen bij poedercoating, blikken bij natlak. */
const verpakking=n=>isMagazijn()
  ? t(n===1?"verpakkingenkel":"verpakkingmeer")
  : staat.afdeling==="natlak" ? t(n===1?"bus":"bussen")
  : t(n===1?"doos":"dozen");

const opslagWerkt=(()=>{
  try{ localStorage.setItem("_test","1"); localStorage.removeItem("_test"); return true; }
  catch(e){ return false; }
})();

let bestand=laden();
let db=null;                       // wordt gezet zodra de afdeling bekend is
let migratieFout="";

function kiesAfdeling(sleutel){
  staat.uitScan=false; staat.scanBarcode=false; staat.scanDoel="";
  if(!bestand.afdelingen[sleutel]) bestand.afdelingen[sleutel]=legeAfdeling();
  staat.afdeling=sleutel;
  db=bestand.afdelingen[sleutel];
}

function laden(){
  if(!opslagWerkt) return JSON.parse(JSON.stringify(LEEG));
  try{
    const ruw=localStorage.getItem(SLEUTEL)||localStorage.getItem("poedervoorraad_v1");
    if(!ruw) return JSON.parse(JSON.stringify(LEEG));
    const g=JSON.parse(ruw);
    const nieuw=JSON.parse(JSON.stringify(LEEG));
    nieuw.instellingen=Object.assign(nieuw.instellingen,g.instellingen||{});
    if(g.afdelingen){
      for(const k in nieuw.afdelingen)
        if(g.afdelingen[k]) nieuw.afdelingen[k]=Object.assign(legeAfdeling(),g.afdelingen[k]);
    }else if(g.artikelen){
      // Gegevens uit een versie met één afdeling: die was altijd poedercoating.
      nieuw.afdelingen.poeder={artikelen:g.artikelen||[],mutaties:g.mutaties||[],
        tellers:g.tellers||{artikel:0},dozen:g.dozen};
    }
    return nieuw;
  }catch(e){ console.error("Opslag onleesbaar:",e); return JSON.parse(JSON.stringify(LEEG)); }
}
function opslaan(){
  try{ meldEigenVersie(); }catch(e){}
  bestand.gewijzigd=Date.now();
  if(!opslagWerkt) return;
  try{ localStorage.setItem(SLEUTEL,JSON.stringify(bestand)); }
  catch(e){ console.error("Opslaan mislukt:",e); }
  planSync();
  if(gebruiker) setTimeout(controleerMeldingen,0);
}

/** Unieke code per afdeling: A voor poedercoating, N voor natlak. */
function volgendeArtikelCode(){
  db.tellers.artikel++;
  return (staat.afdeling==="natlak"?"N":staat.afdeling==="magazijn"?"M":"A")+String(db.tellers.artikel).padStart(6,"0");
}
/** Elke mutatie krijgt een id dat nergens anders voorkomt, ook niet op een
 *  ander apparaat. Zo kunnen twee toestellen hun boekingen samenvoegen. */
const apparaatId=(()=>{
  try{
    let id=localStorage.getItem("geuze_apparaat");
    if(!id){ id=Math.random().toString(36).slice(2,8); localStorage.setItem("geuze_apparaat",id); }
    return id;
  }catch(e){ return Math.random().toString(36).slice(2,8); }
})();
function nieuwId(lijst){
  if(lijst===db.mutaties) return apparaatId+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6);
  return lijst.reduce((m,r)=>Math.max(m,typeof r.id==="number"?r.id:0),0)+1;
}

/** Zet gegevens uit eerdere versies om naar het huidige model. */
function migreer(){
  let v=false;
  const glansMap={mat:"Mat",zijdeglans:"Zijdeglans",glans:"Glans",hoogglans:"Hoogglans"};
  for(const sleutel in bestand.afdelingen){
    const a=bestand.afdelingen[sleutel];
    a.artikelen=a.artikelen||[]; a.mutaties=a.mutaties||[]; a.tellers=a.tellers||{artikel:0};
    if(!a.vragen){ a.vragen=[]; v=true; }
    if(!a.historie){ a.historie=[]; v=true; }
    // Een check bestond eerst uit één regel; die wordt nu de eerste laag.
    a.vragen.forEach(x=>{
      if(!x.lagen){ x.lagen=x.wat?[{id:"l0",wat:x.wat}]:[]; delete x.wat; v=true; }
    });
    a.artikelen.forEach(x=>{
      // Magazijnartikelen hebben geen kleur of glansgraad; die overslaan.
      if(sleutel==="magazijn"){
        if(!x.soort){ x.soort="magazijn"; v=true; }
        if(!x.categorie){ x.categorie="Overig"; v=true; }
        if(!x.eenheid){ x.eenheid="stuk"; v=true; }
        if(x.standaard===undefined){ x.standaard=(x.minVoorraadGram||0)>0; v=true; }
        if(x.barcode===undefined){ x.barcode=""; v=true; }
        if(typeof x.voorraadGram!=="number"){ x.voorraadGram=0; v=true; }
        return;
      }
      if(x.standaard===undefined){ x.standaard=false; v=true; }
      if(x.serie===undefined){ x.serie=""; v=true; }
      if(x.artikelnummer===undefined){ x.artikelnummer=""; v=true; }
      if(!x.merk){ x.merk=x.leverancier||"Onbekend"; v=true; }
      if(!x.type){ x.type=x.kwaliteit?x.kwaliteit.charAt(0).toUpperCase()+x.kwaliteit.slice(1):"Polyester"; v=true; }
      if(!x.kleur){ x.kleur=x.ral?normaliseerKleur(x.ral):(x.kleurnaam||x.naam||"Onbekend"); v=true; }
      if(glansMap[x.glans]){ x.glans=glansMap[x.glans]; v=true; }
      // Een woord als glansgraad wordt een meetwaarde in Gloss Units.
      if(typeof x.glans!=="number"){
        const g=glansGetal(x.glans);
        x.glans=(g===null?75:Math.round(g)); v=true;
      }
      if(!x.soort){ x.soort=/primer/i.test(x.type)?"primer":(sleutel==="natlak"?"aflak":"topcoat"); v=true; }
      // Natlak werkt met aflak en primer; oudere regels worden omgezet zodat
      // ze niet uit de lijst verdwijnen.
      if(sleutel==="natlak"&&!SOORTEN_PER.natlak[x.soort]){
        x.soort=/primer|grond/i.test(x.soort+" "+x.type)?"primer":"aflak"; v=true;
      }
      if(sleutel==="poeder"&&!SOORTEN_PER.poeder[x.soort]){
        x.soort=/primer|grond/i.test(x.soort+" "+x.type)?"primer":"topcoat"; v=true;
      }
      if(x.barcode===undefined){ x.barcode=""; v=true; }
      if(x.locatie!==undefined){ delete x.locatie; v=true; }
      if(typeof x.voorraadGram!=="number"){ x.voorraadGram=0; v=true; }
      const info=ralInfo(x.kleur);
      if(info&&(x.hex!==info.hex||x.kleurnaam!==info.naam)){ x.hex=info.hex; x.kleurnaam=info.naam; v=true; }
    });
    // Mutaties zonder uniek id krijgen er alsnog een, nodig om te kunnen samenvoegen.
    a.mutaties.forEach((m,i)=>{
      if(typeof m.id!=="string"){ m.id="oud-"+sleutel+"-"+i; v=true; }
    });
    if(a.dozen){
      a.artikelen.forEach(x=>{
        x.voorraadGram=a.dozen.filter(d=>d.artikelId===x.id&&(d.status==="VOL"||d.status==="OPEN"))
          .reduce((s,d)=>s+d.restGram,0);
      });
      delete a.dozen; v=true;
    }
  }
  if(v) opslaan();
}

const artikel=id=>db.artikelen.find(a=>a.id===id);
// Eén barcode kan bij meerdere coatings horen, bijvoorbeeld een verzamelcode
// als CEWEPOL-DIV-KLEUR die voor alle kleuren van die serie geldt.
const artikelenOpCode=c=>{
  const z=normaliseerBarcode(c);
  if(!z) return [];
  return db.artikelen.filter(a=>a.code===z||normaliseerBarcode(a.barcode)===z);
};
const artikelOpCode=c=>artikelenOpCode(c)[0];
const tijdNl=d=>new Date(d).toLocaleString("nl-NL",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
// Kleur en naam komen altijd vers uit de RAL-tabel, zodat coatings die zijn
// aangemaakt toen de tabel nog korter was vanzelf hun juiste kleur krijgen.
const kleurnaamVan=a=>{ const i=a&&ralInfo(a.kleur); return i?i.naam:((a&&a.kleurnaam)||""); };
const MAG_TINT=["#8a8f94","#7d8a72","#8c7f6e","#6f7f8a","#8a7280","#7a8578","#8b8474","#75808c","#877c86","#7f8480"];
const kleurVan=a=>{
  if(isMagazijn()){
    const i=Math.max(0,MAG_CATEGORIE.indexOf(a&&a.categorie));
    return MAG_TINT[i%MAG_TINT.length];
  }
  const i=a&&ralInfo(a.kleur);
  return i?i.hex:((a&&a.hex)||"#6b6e6f");
};
const titel=a=>{
  if(!a) return "?";
  if(isMagazijn()) return a.naam||a.kleur||"?";
  const naam=ralNaam(a.kleur)||kleurnaamVan(a);
  return a.kleur+(naam?" "+naam:"");
};
const hoofdregel=a=>{
  if(!a) return "";
  if(a.soort==="magazijn"||isMagazijn()) return (a.merk?a.merk+" · ":"")+(a.naam||a.kleur||"");
  return `${a.merk} · ${a.kleur} · ${glansNaam(a.glans)}`;
};
/** De regel eronder: bij coating het type, bij het magazijn categorie en maat. */
const bijregel=a=>{
  if(!a) return "";
  if(isMagazijn()) return [catNaam(a.categorie),a.maat].filter(Boolean).join(" · ");
  // Dubbele waarden eruit: als type en serie hetzelfde zijn, één keer tonen.
  return [...new Set([soortNaam(a.soort),typeNaam(a.type),a.serie,a.artikelnummer]
    .map(x=>(x||"").trim()).filter(Boolean))].join(" · ");
};
const totaalGram=groep=>db.artikelen.filter(a=>!groep||groepVan(a)===groep).reduce((s,a)=>s+a.voorraadGram,0);

/** De enige plek waar voorraad verandert: bijwerken én altijd een
 *  mutatieregel wegschrijven, zodat de historie nooit gaten heeft. */
function boek(artikelId,type,gram,extra={}){
  // Laatste grendel: wie alleen mag kijken kan de voorraad nooit wijzigen,
  // ook niet als er ergens toch een knop zou blijven staan.
  if(!magWijzigen()) throw new Error(t("alleenkijken"));
  const a=artikel(artikelId);
  if(!a) throw new Error("Coating niet gevonden");
  const nieuw=a.voorraadGram+gram;
  if(nieuw<0) throw new Error("Er is nog maar "+kgTekst(a.voorraadGram)+" in huis");
  a.voorraadGram=nieuw;
  db.mutaties.push({id:nieuwId(db.mutaties),artikelId,type,gram,restGramNa:nieuw,
    opmerking:extra.opmerking||"",dozen:extra.dozen||0,
    datum:new Date().toISOString()});
  opslaan();
}
const historie=id=>db.mutaties.filter(m=>m.artikelId===id)
  .sort((x,y)=>new Date(y.datum)-new Date(x.datum));

/* ---- bestelgrenzen ---- */
const minVan=a=>Math.max(0,(a&&a.minVoorraadGram)||0);
const maxVan=a=>Math.max(0,(a&&a.maxVoorraadGram)||0);
/** Moet dit artikel besteld worden? */
const moetBesteld=a=>a.actief&&a.standaard&&minVan(a)>0&&a.voorraadGram<=minVan(a);
const teBestellen=()=>db.artikelen.filter(moetBesteld);
/** Hoeveel er bij moet om weer op het maximum te komen. */
const bestelAantal=a=>Math.max(0,(maxVan(a)||minVan(a)*2)-a.voorraadGram);

function teken(){
  // Het scherm wordt ook opnieuw opgebouwd als er via de synchronisatie iets
  // binnenkomt. Wie op dat moment aan het typen is, mag niets kwijtraken:
  // onthoud het veld, de inhoud en de plaats van de cursor.
  const bezig=document.activeElement;
  const typwerk=(bezig&&bezig.id&&(bezig.tagName==="INPUT"||bezig.tagName==="TEXTAREA"))
    ? {id:bezig.id,waarde:bezig.value,start:bezig.selectionStart,eind:bezig.selectionEnd}
    : null;
  // Komt de verversing van buiten, dan is het scherm niet door de gebruiker
  // veranderd: dan bewaren we het hele formulier. Bij een eigen handeling juist
  // niet, want dan hoort het scherm wél te veranderen.
  const alles=vanSync
    ? [...document.querySelectorAll("#scherm input,#scherm textarea,#scherm select")]
        .filter(e=>e.id&&e.type!=="file").map(e=>({id:e.id,waarde:e.value}))
    : [];

  // Onthoud waar je in een lange lijst stond; anders spring je bij elke tik
  // weer naar boven.
  const rollen=[".lijstpaneel .paneelbody",".detailpaneel",".paneel.scroll",
                ".paneelbody.strak",".zijbalk"];
  const stand={};
  rollen.forEach(s=>{ const e=document.querySelector(s); if(e) stand[s]=e.scrollTop; });

  const uit=tekenScherm();
  zetLogos();
  rollen.forEach(s=>{
    const e=document.querySelector(s);
    if(e&&stand[s]) e.scrollTop=stand[s];
  });

  alles.forEach(v=>{
    const veld=document.getElementById(v.id);
    if(veld&&veld.value!==v.waarde) veld.value=v.waarde;
  });
  if(typwerk){
    const veld=document.getElementById(typwerk.id);
    if(veld&&(veld.tagName==="INPUT"||veld.tagName==="TEXTAREA")){
      if(veld.value!==typwerk.waarde) veld.value=typwerk.waarde;
      try{
        veld.focus({preventScroll:true});
        if(typwerk.start!=null) veld.setSelectionRange(typwerk.start,typwerk.eind);
      }catch(e){}
    }
  }
  return uit;
}

  document.getElementById("onderbalk").innerHTML=zichtbaar.concat([{k:"instellingen",kort:t("meer"),i:"instellingen"}]).map(m=>
    `<button class="${staat.scherm===m.k?"actief":""}" onclick="${m.k==="uitboeken"?"app.naarUitboeken()":"app.ga('"+m.k+"')"}">${ico(m.i)}<span>${m.kort||m.l}</span></button>`).join("");

  document.getElementById("kopTitel").textContent=t(staat.scherm)||t("voorraad");

  document.getElementById("afdBalk").innerHTML=

    (magKiezen?(()=>{const st=standAlles(); return `<div class="afdkeuze">${gebruiker.afdelingen.map(k=>{
        const n=st[k]?st[k].checks+st[k].bestel:0;
        return `<button class="${staat.afdeling===k?"actief":""}" onclick="app.zetAfdeling('${k}')">${
          t(k==="poeder"?"poedercoating":k==="natlak"?"natlak":"magazijn")}${
          n?` <span class="telbol">${n}</span>`:""}</button>`;}).join("")}</div>`;})()
      :`<span class="afdnaam">${t(staat.afdeling==="poeder"?"poedercoating":staat.afdeling==="natlak"?"natlak":"magazijn")}</span>`)+
    `<button class="knop s rand" onclick="app.logUit()">${esc(gebruiker.naam)} · ${t("uitloggen")}</button>`;
  const vw=document.getElementById("versiewaarschuwing");
  if(vw){
    const nieuwer=nieuwereVersie();
    if(versieOpServer){
      vw.innerHTML=`<div class="melding let syncbalk">
        <div style="min-width:0"><b>${t("nieuweversie")}</b><br>
          <span class="klein">${t("nieuweversiesub")} ${esc(versieOpServer)} · ${t("ditapparaat")}: ${esc(VERSIE)}</span></div>
        <button class="knop s lime" onclick="app.laadOpnieuw()">${t("bijwerken")}</button>
      </div>`;
    }else{
      vw.innerHTML=nieuwer?`<div class="melding let syncbalk">
        <div style="min-width:0"><b>${t("oudeversie")}</b><br>
          <span class="klein">${t("oudeversiesub").replace("{n}",esc(nieuwer))}
            ${t("ditapparaat")}: ${esc(VERSIE)}</span></div>

  if(kv&&!isMagazijn()) toonKleur(kv.value,"kleurHintDetail");

/** Onthouden e-mailadressen per leverancier; die gaan mee met de synchronisatie. */
function levMails(){
  const bh=beheerDeel();
  if(!bh.levMail) bh.levMail={};
  return bh.levMail;
}
function bestelRegels(lev){
  return teBestellen()
    .filter(a=>levVan(a)===lev)
    .sort((x,y)=>hoofdregel(x).localeCompare(hoofdregel(y)))
    .map(a=>{
      const aantal=gramNaarKg(bestelAantal(a))+" "+artEenheid(a,bestelAantal(a));
      const wat=[a.merk,a.naam].filter(Boolean).join(" ")||a.naam||a.code;
      const extra=[a.maat,a.code].filter(Boolean).join(", ");
      return "- "+wat+(extra?" ("+extra+")":"")+" — "+aantal;
    });
}
function bestelTekst(lev){
  const regels=bestelRegels(lev);
  const zonder=t("geenleverancier");
  return [
    t("mailaanhef").replace("{n}",lev===zonder?"":" "+lev)+",",
    "",
    t("mailinleiding")+":",
    "",
    regels.join("\n"),
    "",
    t("mailafsluiting"),
    t("bedrijfsnaam")
  ].join("\n");
}
function toonBestelMail(lev){
  staat.bestelLev=lev;
  teken();
}
function sluitBestelMail(){ staat.bestelLev=null; teken(); }

function bewaarLevMail(){
  const e=document.getElementById("bmAdres");
  if(!e) return;
  const bh=beheerDeel();
  levMails()[staat.bestelLev]=e.value.trim();
  bh.gewijzigd=Date.now();
  opslaan();
}
async function kopieerBestelling(){
  const vak=document.getElementById("bmTekst");
  if(!vak) return;
  bewaarLevMail();
  try{
    await navigator.clipboard.writeText(vak.value);
    toast(t("gekopieerd"));
  }catch(e){
    // Zonder toestemming voor het klembord: selecteren, dan kan het met de hand.
    vak.focus(); vak.select();
    toast(t("kopieerzelf"));
  }
}
function openBestelMail(){
  bewaarLevMail();
  const vak=document.getElementById("bmTekst");
  const adres=(document.getElementById("bmAdres")||{}).value||"";
  const ond=(document.getElementById("bmOnderwerp")||{}).value||"";
  const url="mailto:"+encodeURIComponent(adres.trim())
    +"?subject="+encodeURIComponent(ond)
    +"&body="+encodeURIComponent(vak?vak.value:"");
  location.href=url;
}

function bestelLijst(){
  const lijst=teBestellen();
  if(!lijst.length) return `<div class="leeg" style="padding:30px 16px">
      <div class="leegteken">${ico("bericht")}</div>
      <h2>${t("nietsbestellen")}</h2>
      <p>${t("nietsbestellensub")}</p>
    </div>`;
  const perGroep={};
  const sleutel=a=>isMagazijn()?levVan(a):soortNaam(a.soort);
  lijst.forEach(a=>{ (perGroep[sleutel(a)]=perGroep[sleutel(a)]||[]).push(a); });
  const zonder=t("geenleverancier");
  const namen=Object.keys(perGroep).sort((x,y)=>x===zonder?1:y===zonder?-1:x.localeCompare(y));
  return namen.map(g=>{
    const items=perGroep[g].sort((x,y)=>hoofdregel(x).localeCompare(hoofdregel(y)));
    return `<div class="groep"><span class="opschrift">${esc(g)}</span>
        <span class="streep"></span>
        ${isMagazijn()&&magBoeken()?`<button class="knop s rand bestelknop"
          onclick="app.toonBestelMail('${esc(g).replace(/'/g,"&#39;")}')">${ico("mail")}${t("bestelmailknop")}</button>`:""}
        <span class="klein flauw">${items.length}</span></div>`+
      items.map(a=>{
        const op=a.voorraadGram<=0;
        return `<div class="rij" onclick="app.ga('voorraad',{artikelId:${a.id}})">
          ${isMagazijn()?magIcoon(a):`<span class="stip" style="background:${esc(kleurVan(a))}"></span>`}
          <span style="min-width:0">
            <b>${esc(hoofdregel(a))}</b>
            <span class="klein flauw">${esc(bijregel(a))}</span>
            <span class="merkje ${op?"rood":"oranje"}">${op?t("opraken"):t("bijnaop")}</span>
          </span>
          <span style="text-align:right;white-space:nowrap">
            <span class="getal groot">${gramNaarKg(bestelAantal(a))} <span class="klein flauw"
              style="font-weight:500">${esc(artEenheid(a,bestelAantal(a)))}</span></span>
            <span class="klein flauw" style="display:block">${t("tebestellen")}</span>
            <span class="klein flauw" style="display:block">${t("nuinvoorraad")} ${kgTekst(a.voorraadGram,a)}
              · ${t("minlabel")} ${gramNaarKg(minVan(a))}${maxVan(a)?" · "+t("maxlabel")+" "+gramNaarKg(maxVan(a)):""}</span>
          </span>
        </div>`;
      }).join("");
  }).join("");
}

/* ============================================================
   VRAGEN — de plek waar kantoor en de afdeling elkaar spreken.
   Vervangt de losse takenlijst: kantoor vraagt of er genoeg is
   voor een order, de afdeling kijkt en reageert, en daarna gaat
   de vraag dicht.
   ============================================================ */
/** Korte tijdsaanduiding: vandaag het uur, anders de datum. */
function tijdKort(ms){
  if(!ms) return "";
  const d=new Date(ms), nu=new Date();
  const zelfde=d.toDateString()===nu.toDateString();
  return zelfde
    ? d.toLocaleTimeString(huidigeTaal(),{hour:"2-digit",minute:"2-digit"})
    : d.toLocaleDateString(huidigeTaal(),{day:"numeric",month:"short"});
}
/* Vragen zijn er voor poedercoating en natlak; in het magazijn wordt niet
   per order overlegd, daar telt alleen de bestelgrens. */
const vragenAan=()=>!isMagazijn();
const BEWAARDAGEN=30;
const HISTORIEDAGEN=365;
/** Na 30 dagen gaat een afgehandelde check naar de historie, en na een jaar
 *  in de historie verdwijnt hij pas echt. */
/** Elk apparaat schrijft op welke uitvoering het draait. Zo zie je meteen
 *  wanneer er ergens nog een oude versie openstaat. */
/* De app kijkt zelf of er een nieuwer bestand op de server staat. Nodig omdat
   een app op het beginscherm het oude bestand vasthoudt en niet zelf ophaalt. */
let versieOpServer="";
async function kijkNaarUpdate(){
  if(location.protocol==="file:") return;
  try{
    const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const tekst=await r.text();
    const m=/const VERSIE="([^"]+)"/.exec(tekst);
    if(!m) return;
    if(versieNummer(m[1])>versieNummer(VERSIE)){
      versieOpServer=m[1];
      if(gebruiker) teken();
    }
  }catch(e){}
}
function laadOpnieuw(){
  // Met een eigen adres erbij, anders geeft de browser het bewaarde bestand.
  location.replace(location.pathname+"?v="+Date.now());
}

function meldEigenVersie(){
  bestand.versies=bestand.versies||{};
  if(bestand.versies[apparaatId]!==VERSIE){
    bestand.versies[apparaatId]=VERSIE;
    return true;
  }
  return false;
}
const versieNummer=v=>{ const m=/v(\d+)/.exec(String(v||"")); return m?+m[1]:0; };
/** De hoogste versie die ergens in gebruik is, of "" als dat deze is. */
function nieuwereVersie(){
  const eigen=versieNummer(VERSIE);
  let beste="", nr=eigen;
  for(const k in (bestand.versies||{})){
    const n=versieNummer(bestand.versies[k]);
    if(n>nr){ nr=n; beste=bestand.versies[k]; }
  }
  return beste;
}

function opruimVragen(){
  const grens=Date.now()-BEWAARDAGEN*86400000;
  const oud=Date.now()-HISTORIEDAGEN*86400000;
  let veranderd=0;
  for(const sleutel in bestand.afdelingen){
    const a=bestand.afdelingen[sleutel];
    a.vragen=a.vragen||[]; a.historie=a.historie||[];
    const blijft=[], naarHistorie=[];
    a.vragen.forEach(v=>{
      const wanneer=v.gewijzigd||Date.parse(v.datum)||0;
      if(v.status==="klaar"&&wanneer<=grens){
        v.gearchiveerdOp=Date.now();
        naarHistorie.push(v);
      }else blijft.push(v);
    });
    if(naarHistorie.length){ a.vragen=blijft; a.historie=a.historie.concat(naarHistorie); veranderd+=naarHistorie.length; }
    const over=a.historie.filter(v=>(v.gearchiveerdOp||0)>oud);
    if(over.length!==a.historie.length){ veranderd+=a.historie.length-over.length; a.historie=over; }
  }
  return veranderd;
}
/* ============================================================
   ONGELEZEN — per persoon en per afdeling bijgehouden op dit apparaat.
   Iets is nieuw voor jou als het van iemand anders komt en later is
   dan het moment waarop jij die check voor het laatst opendeed.
   ============================================================ */
let gelezenMap={};
const gelezenSleutel=()=>"geuze_gelezen_"+(gebruiker?gebruiker.naam:"")+"_"+staat.afdeling;
function laadGelezen(){
  try{ gelezenMap=JSON.parse(localStorage.getItem(gelezenSleutel())||"{}"); }
  catch(e){ gelezenMap={}; }
}
function markeerGelezen(id){
  if(!id) return;
  gelezenMap[id]=Date.now();
  try{ localStorage.setItem(gelezenSleutel(),JSON.stringify(gelezenMap)); }catch(e){}
}
/** Hoeveel nieuwe berichten staan er voor jou in deze check? */
function ongelezenVan(v){
  if(!gebruiker) return 0;
  const sinds=gelezenMap[v.id]||0;
  let n=0;
  if(v.door!==gebruiker.naam&&(Date.parse(v.datum)||0)>sinds) n++;
  (v.reacties||[]).forEach(r=>{
    if(r.door!==gebruiker.naam&&(Date.parse(r.datum)||0)>sinds) n++;
  });
  return n;
}
const ongelezenTotaal=()=>vragenVan().filter(v=>ongelezenVan(v)>0).length;

/* Hetzelfde voor de bestellijst: wat pas onder het minimum is gezakt telt als
   nieuw, tot je de lijst een keer bekijkt. Herstelt de voorraad en zakt hij
   later opnieuw, dan telt hij weer mee. */
let gezienBestel={};
const bestelSleutel=()=>"geuze_bestel_"+(gebruiker?gebruiker.naam:"")+"_"+staat.afdeling;
function laadBestelGezien(){
  try{ gezienBestel=JSON.parse(localStorage.getItem(bestelSleutel())||"{}"); }
  catch(e){ gezienBestel={}; }
}
function markeerBestelGezien(){
  const nu={};
  teBestellen().forEach(a=>{ nu[a.id]=true; });
  const zelfde=Object.keys(nu).length===Object.keys(gezienBestel).length
    && Object.keys(nu).every(k=>gezienBestel[k]);
  if(zelfde) return;
  gezienBestel=nu;
  try{ localStorage.setItem(bestelSleutel(),JSON.stringify(nu)); }catch(e){}
}
const nieuweBestellingen=()=>teBestellen().filter(a=>!gezienBestel[a.id]).length;

/* ============================================================
   STAND PER AFDELING — kantoor en admin zien meerdere afdelingen.
   Deze functies rekenen door voor een afdeling waar je nu níét in
   staat, zodat er niets over het hoofd gezien wordt.
   ============================================================ */
function leesMap(sleutel){
  try{ return JSON.parse(localStorage.getItem(sleutel)||"{}"); }catch(e){ return {}; }
}
function standVan(afd){
  const a=bestand.afdelingen[afd];
  const uit={checks:0,bestel:0,nieuw:[]};
  if(!a||!gebruiker) return uit;
  const gel=leesMap("geuze_gelezen_"+gebruiker.naam+"_"+afd);
  if(afd!=="magazijn"){
    (a.vragen||[]).forEach(v=>{
      const sinds=gel[v.id]||0;
      let n=0, laatste=null;
      if(v.door!==gebruiker.naam&&(Date.parse(v.datum)||0)>sinds){ n++; laatste={soort:"check",v}; }
      (v.reacties||[]).forEach(r=>{
        if(r.door!==gebruiker.naam&&(Date.parse(r.datum)||0)>sinds){ n++; laatste={soort:"reactie",v,r}; }
      });
      if(n){ uit.checks++; uit.nieuw.push(Object.assign({afd,id:v.id,aantal:n},laatste)); }
    });
  }
  const gez=leesMap("geuze_bestel_"+gebruiker.naam+"_"+afd);
  (a.artikelen||[]).forEach(x=>{
    const min=Math.max(0,x.minVoorraadGram||0);
    if(x.actief&&x.standaard&&min>0&&x.voorraadGram<=min&&!gez[x.id]){
      uit.bestel++;
      uit.nieuw.push({afd,soort:"bestel",id:"b"+x.id,artikel:x,aantal:1});
    }
  });
  return uit;
}
const standAlles=()=>{
  const uit={};
  (gebruiker?gebruiker.afdelingen:[]).forEach(a=>{ uit[a]=standVan(a); });
  return uit;
};
/** Alles bij elkaar over alle afdelingen die deze gebruiker mag zien. */
const aandachtAlles=()=>{
  let n=0;
  const s=standAlles();
  for(const a in s) n+=s[a].checks+s[a].bestel;
  return n;
};

const vragenVan=()=>(db.vragen=db.vragen||[]);
const openVragen=()=>vragenVan().filter(v=>v.status!=="klaar");
const vraag=id=>vragenVan().find(v=>v.id===id);

/** Alles bij elkaar waar iemand iets mee moet: open vragen plus bestellingen. */
/* Bij poedercoating en natlak telt de knop hoeveel checks er ongelezen zijn,
   net als bij een berichtenapp. Het magazijn kent geen checks; daar telt hij
   wat er besteld moet worden. */
const aandachtAantal=()=>aandachtAlles();

/* De titel van een check is de opsomming van zijn lagen. */
const lagenVan=v=>(v&&v.lagen&&v.lagen.length)?v.lagen:(v&&v.wat?[{wat:v.wat}]:[]);
const checkTitel=v=>lagenVan(v).map(l=>l.wat).filter(Boolean).join(" + ")||"—";
/** De kop van een check: het ordernummer met de klant erachter. */
const checkKop=v=>{
  const d=[(v.order||"").trim(),(v.klant||"").trim()].filter(Boolean);
  return d.length?d.join(": "):t("zonderorder");
};

function leegVraagForm(){
  return {order:"",klant:"",toelichting:"",lagen:[{wat:"",artikelId:"",nodig:""}]};
}
/** Onthoudt wat er in het formulier staat, zodat een laag toevoegen niets wist. */
function bewaarVraagForm(){
  const f=staat.vraagForm=staat.vraagForm||leegVraagForm();
  const v=id=>{const e=document.getElementById(id);return e?e.value:undefined;};
  // De veldnamen staan hier los van de gegevensnamen, anders raakt er iets zoek.
  const velden={order:"vOrder",klant:"vKlant",toelichting:"vToel"};
  for(const k in velden){
    const w=v(velden[k]);
    if(w!==undefined) f[k]=w;
  }
  f.lagen.forEach((l,i)=>{
    const a=v("vLaag"+i), b=v("vArt"+i), c=v("vNodig"+i);
    if(a!==undefined) l.wat=a;
    if(b!==undefined) l.artikelId=b;
    if(c!==undefined) l.nodig=c;
  });
}
function voegLaagToe(){
  bewaarVraagForm();
  staat.vraagForm.lagen.push({wat:"",artikelId:"",nodig:""});
  teken();
}
function verwijderLaag(i){
  bewaarVraagForm();
  if(staat.vraagForm.lagen.length>1) staat.vraagForm.lagen.splice(i,1);
  teken();
}

function nieuweVraag(){
  if(grendelVraag()) return;
  bewaarVraagForm();
  const f=staat.vraagForm;
  const lagen=f.lagen
    .filter(l=>(l.wat||"").trim())
    .map(l=>({id:"l"+Math.random().toString(36).slice(2,8),
      wat:l.wat.trim(),
      artikelId:l.artikelId?+l.artikelId:null,
      nodig:(l.nodig||"").trim()}));
  if(!lagen.length) return toast(t("laagverplicht"));
  const v={
    id:apparaatId+"-v"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6),
    lagen, order:(f.order||"").trim(), klant:(f.klant||"").trim(),
    toelichting:(f.toelichting||"").trim(),
    status:"open", door:gebruiker.naam, datum:new Date().toISOString(),
    gewijzigd:Date.now(), reacties:[]
  };
  vragenVan().push(v);
  opslaan();
  Object.assign(staat,{vraagNieuw:false,vraagId:v.id,vraagForm:leegVraagForm()});
  toast(t("vraaggeplaatst"));
  teken();
}

function plaatsReactie(tekst){
  if(grendelVraag()) return;
  const v=vraag(staat.vraagId);
  if(!v) return;
  const veld=document.getElementById("vReactie");
  const t2=(tekst||(veld?veld.value:"")).trim();
  if(!t2) return;
  v.reacties=v.reacties||[];
  v.reacties.push({
    id:apparaatId+"-r"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6),
    door:gebruiker.naam, tekst:t2, datum:new Date().toISOString()
  });
  v.gewijzigd=Date.now();
  if(veld) veld.value="";
  opslaan(); toast(t("reactiegeplaatst")); teken();
}

function wisselVraagStatus(){
  if(grendelVraag()) return;
  const v=vraag(staat.vraagId);
  if(!v) return;
  v.status=v.status==="klaar"?"open":"klaar";
  v.gewijzigd=Date.now();
  opslaan(); teken();
}
function verwijderVraag(){
  if(grendel()) return;
  const v=vraag(staat.vraagId);
  if(!v||!confirm(t("vraagweg"))) return;
  db.vragen=vragenVan().filter(x=>x.id!==v.id);
  staat.vraagId=null;
  opslaan(); teken();
}
function kiesVraag(id){
  markeerGelezen(id);
  Object.assign(staat,{vraagId:id,vraagNieuw:false,vraagBewerk:false});
  teken();
}
function zetVraagNieuw(aan){
  Object.assign(staat,{vraagNieuw:aan,vraagId:null,vraagForm:aan?leegVraagForm():null});
  teken();
}
function zetBerichtTab(tab){ staat.berichtTab=tab; teken(); }
/** Vragen mogen door iedereen die de afdeling ziet; kijken alleen is te weinig. */
function grendelVraag(){
  if(gebruiker) return false;
  return true;
}

/* ---- het scherm ---- */
function schermBerichten(){
  // Zonder vragen is er niets te kiezen: dan meteen de bestellijst.
  if(!vragenAan()) return `<div class="tweepaneel"><section class="paneel scroll" style="grid-column:1/-1">
    <div class="paneelkop"><h2>${t("bestellijst")}</h2><span class="pil">${teBestellen().length}</span></div>
    <div class="paneelbody strak">${bestelLijst()}</div>

  const kop=`<div class="richting opKaart">
      <button class="${tab==="vragen"?"actief":""}" onclick="app.zetBerichtTab('vragen')">
        ${t("vragen")}${nNieuw?` <span class="telbol">${nNieuw}</span>`:""}</button>
      <button class="${tab==="historie"?"actief":""}" onclick="app.zetBerichtTab('historie')">

    </div>`;

    const oud=(db.historie||[]).slice().sort((a,b)=>(b.gearchiveerdOp||0)-(a.gearchiveerdOp||0));
    return `<div class="tweepaneel"><section class="paneel scroll" style="grid-column:1/-1">
      <div class="paneelkop"><h2>${t("historie")}</h2><span class="pil">${oud.length}</span></div>
      <div class="paneelbody vast">${kop}
        <p class="klein flauw">${t("historieuitleg")}</p></div>
      <div class="paneelbody strak">
        ${oud.length?oud.map(v=>`<div class="rij zonderstip dof">
          <span style="min-width:0">
            <b>${esc(checkKop(v))}</b>
            <span class="klein flauw">${esc(checkTitel(v))}</span>
            ${(v.reacties||[]).length?`<span class="klein flauw laatstereactie">${
              esc(v.reacties[v.reacties.length-1].door)}: ${esc(v.reacties[v.reacties.length-1].tekst)}</span>`:""}
          </span>
          <span style="text-align:right;white-space:nowrap" class="klein flauw">
            ${t("gearchiveerd")}<br>${tijdKort(v.gearchiveerdOp)}</span>
        </div>`).join(""):`<div class="niets" style="padding:16px">${t("geenhistorie")}</div>`}
      </div>
    </section></div>`;
  }

  if(tab==="bestellen") return `<div class="tweepaneel"><section class="paneel scroll" style="grid-column:1/-1">

    <div class="paneelbody vast">${kop}</div>
    <div class="paneelbody strak">${bestelLijst()}</div>
  </section></div>`;

  return `<div class="tweepaneel">
    <section class="paneel lijstpaneel">
      <div class="paneelkop"><h2>${t("vragen")}</h2><span class="pil">${nOpen}</span></div>
      <div class="paneelbody vast">
        ${kop}
        <button class="knop lime breed nietKijken"
          onclick="app.zetVraagNieuw(true)">${t("nieuwevraag")}</button>
      </div>
      <div class="paneelbody strak"><div id="vraaglijst">${vraagLijst()}</div></div>
    </section>
    <section class="paneel detailpaneel">${vraagDetail()}</section>
  </div>`;
}

/** Bestellen kan alleen met een aantal erbij; anders is de melding waardeloos. */
/** Antwoord per laag: er is genoeg, geen bestelling nodig. */
function genoegLaag(i){
  const v=vraag(staat.vraagId);
  if(!v) return;
  const laag=lagenVan(v)[i];
  plaatsReactie((laag&&laag.wat?laag.wat+": ":"")+t("genoeginhuis"));
}
function bestelLaag(i){
  const v=vraag(staat.vraagId);
  if(!v) return;
  const laag=lagenVan(v)[i];
  const veld=document.getElementById("vBestel"+i);
  const n=(veld?veld.value:"").trim();
  if(!n) return toast(t("vulaantal"));
  const a=laag&&laag.artikelId?artikel(laag.artikelId):null;
  if(veld) veld.value="";
  // Altijd erbij welke laag het betreft; bij meerdere lagen is dat het punt.
  plaatsReactie(t("bestelreactie")+" — "+(laag&&laag.wat?laag.wat+": ":"")+n+(a?" "+artEenheid(a,0):""));
}

function vraagLijst(){
  const bij=v=>Date.parse(v.datum)||v.gewijzigd||0;
  // Op het moment van plaatsen, nieuwste bovenaan.
  const alles=vragenVan().slice().sort((a,b)=>bij(b)-bij(a));
  if(!alles.length) return `<div class="niets" style="padding:16px">${t("geenvragen")}</div>`;
  const open=alles.filter(v=>v.status!=="klaar"), klaar=alles.filter(v=>v.status==="klaar");
  const blok=(titel,rijen,extra)=>rijen.length?
    `<div class="groep"><span class="opschrift">${titel}</span>
      <span class="streep"></span><span class="klein flauw">${rijen.length}</span></div>`+
    (extra?`<p class="klein flauw" style="padding:0 8px 6px">${extra}</p>`:"")+
    rijen.map(v=>{
      const laatste=(v.reacties||[]).length?v.reacties[v.reacties.length-1]:null;
      const n=lagenVan(v).length;
      const nieuw=ongelezenVan(v);
      return `<div class="rij zonderstip ${staat.vraagId===v.id?"gekozen":""} ${v.status==="klaar"?"dof":""}
             ${nieuw?"ongelezen":""}" onclick="app.kiesVraag('${v.id}')">
        <span style="min-width:0">
          <b>${esc(checkKop(v))}</b>
          <span class="klein flauw">${[esc(checkTitel(v)),
            n>1?n+" "+t("lagen").toLowerCase():""].filter(Boolean).join(" · ")}</span>
          ${laatste?`<span class="klein flauw laatstereactie">${esc(laatste.door)}: ${esc(laatste.tekst)}</span>`:""}
        </span>
        <span style="text-align:right;white-space:nowrap">
          ${nieuw?`<span class="nieuwbol">${nieuw}</span>`
            :((v.reacties||[]).length?`<span class="merkje neutraal">${(v.reacties||[]).length}</span>`:"")}
          <span class="klein flauw" style="display:block">${tijdKort(bij(v))}</span>
        </span>
